<style>
/* Layout: one full-bleed canvas (the fairground at night); a dark translucent veil with a bulb-lit sign floats over it between runs. Single deliberate dark look. */
:root {
  --noche: #0b0526;
  --velo: rgba(11, 5, 38, 0.68);
  --tinta: #1a0b33;
  --texto: #f3ecff;
  --suave: #c9b8ff;
  --amarillo: #ffe83a;
  --cian: #2ff3ff;
  --rosa: #ff3da8;
  --font-titulo: "Lilita One", "Arial Black", Impact, sans-serif;
  --font-ono: "Bangers", "Lilita One", "Arial Black", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--noche);
  color: var(--texto);
  font-family: var(--font-titulo);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#stage { position: relative; height: 100%; }
#game { display: block; width: 100%; height: 100%; cursor: crosshair; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  padding: 12px 16px;
  text-align: center;
  background: var(--velo);
  overflow-y: auto;
  touch-action: pan-y;
}
/* margin: auto centres the panel and still lets it scroll from its top when it does not fit. */
.panel { display: flex; flex-direction: column; align-items: center; gap: clamp(5px, 1.6vh, 12px); margin: auto; }
.izq, .der { display: contents; }
/* The sign: a red striped board lit with a ring of bulbs (the bulbs are four strips of five colours, see .lt .lb .ll .lr). */
.letrero {
  position: relative;
  margin: 10px 14px;
  padding: 0.12em 0.5em 0.2em;
  background: repeating-linear-gradient(115deg, #d9283f 0 26px, #ea4a5e 26px 52px);
  border: 5px solid var(--tinta);
  border-radius: 12px;
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.14), 0 8px 30px rgba(255, 61, 168, 0.35);
  transform: rotate(-2.5deg);
}
.letrero i { position: absolute; pointer-events: none; }
.lt, .lb {
  left: -9px; right: -9px; height: 14px;
  background:
    radial-gradient(circle at 10px 7px, #fff 0 1px, #ff3da8 1.5px 3.6px, rgba(255, 61, 168, 0.35) 4.2px, transparent 7px) 0 0 / 100px 14px repeat-x,
    radial-gradient(circle at 30px 7px, #fff 0 1px, #ffe83a 1.5px 3.6px, rgba(255, 232, 58, 0.35) 4.2px, transparent 7px) 0 0 / 100px 14px repeat-x,
    radial-gradient(circle at 50px 7px, #fff 0 1px, #2ff3ff 1.5px 3.6px, rgba(47, 243, 255, 0.35) 4.2px, transparent 7px) 0 0 / 100px 14px repeat-x,
    radial-gradient(circle at 70px 7px, #fff 0 1px, #ff8a1f 1.5px 3.6px, rgba(255, 138, 31, 0.35) 4.2px, transparent 7px) 0 0 / 100px 14px repeat-x,
    radial-gradient(circle at 90px 7px, #fff 0 1px, #4dff88 1.5px 3.6px, rgba(77, 255, 136, 0.35) 4.2px, transparent 7px) 0 0 / 100px 14px repeat-x;
}
.lt { top: -10px; }
.lb { bottom: -10px; }
.ll, .lr {
  top: -9px; bottom: -9px; width: 14px;
  background:
    radial-gradient(circle at 7px 10px, #fff 0 1px, #ff8a1f 1.5px 3.6px, rgba(255, 138, 31, 0.35) 4.2px, transparent 7px) 0 0 / 14px 100px repeat-y,
    radial-gradient(circle at 7px 30px, #fff 0 1px, #4dff88 1.5px 3.6px, rgba(77, 255, 136, 0.35) 4.2px, transparent 7px) 0 0 / 14px 100px repeat-y,
    radial-gradient(circle at 7px 50px, #fff 0 1px, #ff3da8 1.5px 3.6px, rgba(255, 61, 168, 0.35) 4.2px, transparent 7px) 0 0 / 14px 100px repeat-y,
    radial-gradient(circle at 7px 70px, #fff 0 1px, #ffe83a 1.5px 3.6px, rgba(255, 232, 58, 0.35) 4.2px, transparent 7px) 0 0 / 14px 100px repeat-y,
    radial-gradient(circle at 7px 90px, #fff 0 1px, #2ff3ff 1.5px 3.6px, rgba(47, 243, 255, 0.35) 4.2px, transparent 7px) 0 0 / 14px 100px repeat-y;
}
.ll { left: -10px; }
.lr { right: -10px; }
.letrero h1 {
  margin: 0;
  font: 400 clamp(46px, min(15vh, 14vw), 112px) / 1 var(--font-titulo);
  color: var(--amarillo);
  letter-spacing: 0.01em;
  white-space: nowrap;
  -webkit-text-stroke: 0.1em var(--tinta);
  paint-order: stroke fill;
  text-shadow: 0.05em 0.07em 0 var(--rosa);
}
.letrero h1 .voy { font-size: 0.55em; color: var(--cian); text-shadow: 0.06em 0.09em 0 #2f7bff; margin-right: 0.12em; }
.letrero.fin { transform: rotate(-1.5deg); }
.letrero.fin h1 { font-size: clamp(34px, min(11vh, 11vw), 78px); }
.overlay p { margin: 0; max-width: 34ch; font-size: clamp(14px, 3.6vh, 19px); line-height: 1.3; color: var(--texto); text-wrap: balance; }
.overlay .sub { color: var(--cian); font-size: clamp(15px, 4.2vh, 22px); }
.overlay .score {
  font: 400 clamp(34px, 11vh, 58px) / 1 var(--font-titulo);
  color: var(--amarillo);
  -webkit-text-stroke: 0.12em var(--tinta);
  paint-order: stroke fill;
  text-shadow: 0.05em 0.07em 0 var(--rosa);
}
.overlay .best { color: var(--suave); font-size: clamp(14px, 3.6vh, 18px); }
.overlay .best.nuevo { color: var(--amarillo); }
.ranking-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ranking-box h2 { margin: 0; font: 400 clamp(13px, 3.4vh, 16px) var(--font-titulo); color: var(--suave); letter-spacing: 0.04em; }
.ranking {
  display: grid;
  grid-template-columns: auto auto auto;
  column-gap: 14px;
  row-gap: 1px;
  align-items: baseline;
  margin: 0;
  padding: 0;
  list-style: none;
  font-variant-numeric: tabular-nums;
}
.ranking li { display: contents; }
.ranking .rank { text-align: end; color: var(--suave); font-size: 15px; }
.ranking .dist { text-align: end; color: #fff; font-size: 20px; line-height: 1.1; }
.ranking .when { text-align: start; color: var(--suave); font-size: 14px; }
.ranking li.current .rank::before { content: "★ "; color: var(--amarillo); }
.ranking li.current .dist, .ranking li.current .when { color: var(--amarillo); }
/* The pink pill of the sketches, with a bolt on each side. */
.overlay button.btn {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 4px 0 6px;
  padding: 6px 26px 8px;
  font: 400 clamp(24px, 7.5vh, 34px) / 1.1 var(--font-titulo);
  color: #fff;
  background: linear-gradient(#ff7cc6, #ff3da8 55%, #e02592);
  border: 3px solid #ffd3ec;
  border-radius: 999px;
  box-shadow: 0 0 0 4px var(--tinta), 0 0 24px 4px rgba(255, 61, 168, 0.65);
  -webkit-text-stroke: 0.14em #7a0f4a;
  paint-order: stroke fill;
  cursor: pointer;
  transition: transform 0.12s;
}
.overlay button.btn::before, .overlay button.btn::after {
  content: "";
  flex: none;
  width: 0.55em;
  height: 0.85em;
  background: var(--amarillo);
  clip-path: polygon(62% 0, 8% 56%, 44% 56%, 32% 100%, 92% 38%, 54% 38%);
}
.overlay button.btn:hover { transform: scale(1.04); }
.overlay button.btn:active { transform: scale(0.97); }
.overlay button:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 4px; }
/* «Volver a la web»: only when the game is served inside camionesycaravanas.es (/trazo, /voycolgao); a quieter button than the main one. */
.overlay button.web, .credito {
  font: 400 clamp(14px, 3.6vh, 17px) / 1.2 var(--font-titulo);
}
.overlay button.web {
  padding: 4px 18px 6px;
  color: var(--suave);
  background: rgba(21, 10, 51, 0.7);
  border: 2px solid #5b3ca8;
  border-radius: 999px;
  cursor: pointer;
}
.overlay button.web:hover { color: #fff; border-color: var(--cian); }
.credito { color: var(--suave); opacity: 0.8; text-decoration: none; }
a.credito:hover { opacity: 1; text-decoration: underline; }
/* Corners: small dark pills so they read over the night scenery. */
.corner {
  position: absolute;
  right: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
}
.controls {
  position: absolute;
  left: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 8px;
}
.mute, .controls button {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px 6px;
  font: 400 15px / 1.1 var(--font-titulo);
  color: var(--texto);
  background: rgba(21, 10, 51, 0.72);
  border: 2px solid #5b3ca8;
  border-radius: 999px;
  cursor: pointer;
}
.mute:hover, .controls button:hover { border-color: var(--cian); color: #fff; }
#mute[aria-pressed="true"] { text-decoration: line-through; color: var(--suave); }
.mute:focus-visible, .controls button:focus-visible { outline: 2px dashed var(--amarillo); outline-offset: 2px; }
/* Touch screens have no keyboard: drop the shortcut hints. */
@media (pointer: coarse) { kbd { display: none; } }
kbd {
  padding: 0 5px;
  font: 12px / 1.5 var(--font-titulo);
  color: var(--suave);
  border: 1px solid currentColor;
  border-radius: 4px;
}
/* Phones in landscape: two columns (sign and texts | ranking and buttons) to stay inside ~360px of height. */
@media (max-height: 520px) and (min-aspect-ratio: 1/1) {
  .panel { flex-direction: row; align-items: center; gap: 4px 30px; }
  .izq, .der { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .letrero { margin: 12px 14px; }
  .letrero h1 { font-size: clamp(34px, 16vh, 68px); }
  .letrero.fin h1 { font-size: clamp(30px, 12vh, 54px); }
  .overlay { padding: 8px 14px; }
}
</style>

<div id="stage">
  <canvas id="game" aria-label="Voy colgao: dibuja el cable de tu coche de choque"></canvas>
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="izq">
        <div class="letrero" id="letrero"><i class="lt"></i><i class="lb"></i><i class="ll"></i><i class="lr"></i><h1 id="headline"></h1></div>
        <p class="sub" id="tagline"></p>

  <div class="corner">
    <button id="fullscreen" class="mute" type="button" aria-pressed="false" hidden><span id="fullscreenLabel"></span> <kbd>F</kbd></button>
    <button id="mute" class="mute" type="button" aria-pressed="false"></button>
  </div>
  <div class="controls" id="controls" hidden>
    <button id="pauseBtn" type="button"><span id="pauseLabel"></span> <kbd>P</kbd></button>
    <button id="restartBtn" type="button"><span id="restartLabel"></span> <kbd>R</kbd></button>
  </div>
</div>

<script>
(() => {
  // Tuning knobs, all in world units (the world is WORLD_H tall; the fairground floor is at FLOOR_Y).
  const C = {
    WORLD_H: 760,
    MIN_VIEW_W: 760,
    PHONE_VIEW_H: 420,
    CAM_Y_FOLLOW: 3,
    CAM_ANCHOR: 0.36,
    CAM_HOOK_Y: 0.46,       // where the hook sits on a short screen (fraction of its height)
    FLOOR_Y: 720,           // the car loses when its lowest point reaches this line
    FLOOR_PAD: 60,          // how much floor is still visible under the lowest camera
    GRAVITY: 1000,
    WALK_ACCEL: 340,
    WALK_SPEED: 190,
    FRICTION: 0.00002,
    DOWNHILL_GRAVITY: 1.3,
    UPHILL_GRAVITY: 0.5,
    BOUNCE: 0.04,
    MAX_SPEED: 850,
    SUBSTEPS: 5,
    HOOK_R: 9,              // only the tip of the pole (the hook) collides with cables
    DROP_R: 13,             // pickup reach of the hook
    PEND_L: 58,             // hanging car: pendulum length, spring and damping (drawing only)
    PEND_K: 6,
    PEND_D: 3,
    POWER_FADE: 0.6,        // seconds in the air until the current is gone
    REHOOK_AIR: 0.35,       // longer than this in the air and re-hooking is a big zap
    DRAW_RADIUS: 260,
    MIN_POINT_DIST: 7,
    INK_MAX: 100,           // cable left to draw ("ink" in the code)
    INK_PER_UNIT: 0.03,
    INK_PICKUP: 35,
    FEED_PER_UNIT: 0.05,
    FEED_EASE: 5,
    BLOB_SPEED_START: 35,
    BLOB_SPEED_GAIN: 0.6,
    BLOB_SPEED_MAX: 200,
    BLOB_LEASH: 80,
    BLOB_SPEED_RATIO: 0.9,
    BLOB_PACE_SMOOTHING: 1.2,
    BLOB_HALF: 170,
    BLOB_ROUND: 140,
    BLOB_TRACK_Y: 1.8,
    CATCH_GAP: 6,
    PICKUP_FLY_TIME: 0.4,
    START_X: -300,
    START_Y: 440,
    START_END: 620,
    UNITS_PER_METER: 40,
    DIFFICULTY_DIST: 40000,
    PICKUP_RAMP_DIST: 16000,
    LOW_INK: 25,
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const headline = document.getElementById('headline');
  const line1 = document.getElementById('line1');
  const line2 = document.getElementById('line2');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const rankingBox = document.getElementById('rankingBox');
  const rankingList = document.getElementById('ranking');
  const startBtn = document.getElementById('start');
  const hintEl = document.getElementById('hint');
  const taglineEl = document.getElementById('tagline');
  const muteBtn = document.getElementById('mute');
  const fullscreenBtn = document.getElementById('fullscreen');
  const controlsEl = document.getElementById('controls');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  // ---------- texts: the only language is Spanish ----------
  const L = {
    titulo: ['VOY', 'COLGAO'],
    subtitulo: 'Huye en coche de choque. ¡Que no te pillen!',
    como1: 'Dibuja el cable con el dedo cerca del gancho.',
    como2: 'Coge fichas para tener más cable.',
    credito: 'Basado en Trazo, de mariomka.',
    hint: 'Se juega mejor con el móvil en horizontal.',
    ranking: 'Tus mejores partidas',
    empezar: '¡A colgarse!', otraVez: 'Otra vez', seguir: 'Seguir', pausa: 'PAUSA',
    pillado: '¡TOPETAZO!', pilladoSub: 'Te ha embestido media feria.',
    caida: '¡SIN CORRIENTE!', caidaSub: 'Has acabado en el puesto de churros.',
    record: 'Récord {d}', nuevoRecord: '¡Nuevo récord!', hudBest: 'récord {d}', meters: '{n} m',
    pantallaCompleta: 'pantalla completa', pausaBtn: 'pausa', reiniciar: 'reiniciar',
    sonido: 'sonido', silenciar: 'Silenciar', activarSonido: 'Activar sonido',
    cable: 'cable', pocoCable: 'poco cable', sinFicha: '¡Sin ficha!',
    aria: 'Voy colgao: dibuja el cable de tu coche de choque',
    web: 'Volver a la web',
    // The fairground man: short phrases on a sign that pops up when something happens. Several per situation; the game never repeats the last one.
    feriante: {
      inicio: ['¡Agárrense que nos vamos!', '¡Bienvenidos a la pista más loca de la feria!'],
      rapido: ['¡QUE SE VAAA, QUE SE VAAA!', '¡Más fuerte, más fuerte!'],
      cerca: ['¡Que te pillan, que te pillan!', '¡Ojo al de atrás, que viene sin frenos!'],
      ficha: ['¡Una fichita más!', '¡Y otra vueltaaa!'],
      sinFicha: ['¡Sin ficha no hay fiesta!', '¡Se acaba el cable!'],
      luz: ['¡Se ha ido la luz!', '¡Apagón en la feria!'],
      vuelve: ['¡Y VUELVE LA FIESTAAA!', '¡Y se hizo la luz!'],
      // Every 100 m, one per stretch (100 m, 200 m...); after the last one, the generic phrase.
      hitos: [
        '¡Cien metros! ¡Esto no lo hace ni la noria!',
        '¡Doscientos! ¡Que alguien avise al feriante!',
        '¡Trescientos! ¡Ya no te paga ni la tómbola!',
        '¡Cuatrocientos! ¡Eso no sale en el cartel!',
        '¡Quinientos! ¡Medio kilómetro de chispas!',
        '¡Seiscientos! ¡Se enfrían los churros!',
        '¡Setecientos! ¡Y sin soltar el palo!',
        '¡Ochocientos! ¡La noria te hace la ola!',
        '¡Novecientos! ¡Que vienen los de la tele!',
        '¡Mil metros! ¡Te ponemos estatua en la entrada!',
      ],
      hito: '¡{n} metros, que no pare la música!',
    },
  };
  const fmtMeters = (n) => L.meters.replace('{n}', n);
  const fmtBest = (template, n) => template.replace('{d}', fmtMeters(n));

  document.getElementById('line1').textContent = L.como1;
  document.getElementById('line2').textContent = L.como2;
  document.getElementById('hint').textContent = L.hint;
  document.getElementById('credito').textContent = L.credito;
  document.getElementById('rankingTitle').textContent = L.ranking;
  document.getElementById('pauseLabel').textContent = L.pausaBtn;
  document.getElementById('restartLabel').textContent = L.reiniciar;
  document.getElementById('fullscreenLabel').textContent = L.pantallaCompleta;
  // «Volver a la web»: only when served inside camionesycaravanas.es (under /trazo or /voycolgao), so the loose copy stays as it was.
  if (/^\/(trazo|voycolgao)(\/|$)/.test(location.pathname)) {
    const webBtn = document.getElementById('web');
    webBtn.textContent = L.web;
    webBtn.hidden = false;
    webBtn.addEventListener('click', () => location.assign('/'));
  }
  document.getElementById('mute').textContent = L.sonido;
  document.getElementById('game').setAttribute('aria-label', L.aria);

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(1);
  const rand = (a, b) => a + (b - a) * rng();

  // ---------- music engine: techno.js of the approved sample, pasted unchanged (only indented) ----------
  /* techno.js - motor de musica techno fiestera en WebAudio puro (sin ficheros, sin dependencias).
   *
   * Uso (tiempo real):
   *   const T = createTechno(ac, ac.destination);
   *   T.start();                       // arranca el planificador (setInterval 25 ms, 0,1 s de antelacion)
   *   T.setIntensity(0..1);            // peligro: abre filtros, mas charles, entra el acid
   *   T.setPower(0..1);                // contacto del gancho con el cable (1 = enganchado)
   *   T.drop(); T.death();             // reenganche (drop) / muerte (tape-stop)
   *   T.chispa(); T.bocina(); T.ficha(); T.topetazo();
   *
   * Uso offline (OfflineAudioContext): createTechno(ac, ac.destination) detecta el contexto offline y no usa
   * setInterval; hay que llamar a T.scheduleUntil(t) para programar la musica hasta el segundo t.
   * Todas las funciones publicas aceptan un tiempo opcional `t` (por defecto, ac.currentTime).
   *
   * Es una funcion global (sin export) para poder pegarla dentro de un <script> de un solo HTML.
   */
  function createTechno(ac, destination, options) {
    options = options || {};
    const BPM = options.bpm || 128;
    const BEAT = 60 / BPM, STEP = BEAT / 4, BAR = BEAT * 4;
    const LOOK = 0.1;            // antelacion del planificador (s)
    const TICK_MS = 25;
    const GAP = LOOK + 0.01;     // corte seco del drop (cubre lo ya programado)
    const manual = options.manual != null ? options.manual
      : (typeof OfflineAudioContext !== 'undefined' && ac instanceof OfflineAudioContext);
    const SR = ac.sampleRate;

    const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
    const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const now = () => ac.currentTime;

    // ------------------------------------------------------------------ ruido y curvas (una sola vez)
    const NOISE_LEN = 2;
    const noiseBuf = ac.createBuffer(1, Math.floor(SR * NOISE_LEN), SR);
    { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

    function satCurve(k) {
      const n = 1024, c = new Float32Array(n), norm = Math.tanh(k);
      for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / norm; }
      return c;
    }

    function makeIR(seconds, damp) {
      const len = Math.floor(SR * seconds), ir = ac.createBuffer(2, len, SR);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch); let lp = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          lp += (w - lp) * damp;                       // oscurece la cola
          d[i] = lp * Math.pow(1 - i / len, 2.6);
        }

      return ir;
    }

    // ------------------------------------------------------------------ cadena fija (se crea una vez)
    const filt = (type, f, q) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q == null ? 0.7 : q; return n; };
    const gainN = (v) => { const g = ac.createGain(); g.gain.value = v; return g; };
    const panN = (v) => { const p = ac.createStereoPanner(); p.pan.value = v; return p; };

    // salida: comp -> limitador -> recorte suave -> ganancia fija (techo ~ -1,4 dBFS)
    const outGain = gainN(0.85);
    const clip = ac.createWaveShaper(); clip.curve = satCurve(1.15); clip.oversample = '2x';
    const limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -4; limiter.knee.value = 1; limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.06;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -13; comp.knee.value = 8; comp.ratio.value = 3.5; comp.attack.value = 0.006; comp.release.value = 0.16;
    const sfxSum = gainN(1);            // todo lo que NO pasa por el filtro de corriente (sfx, zumbido) + musica
    sfxSum.connect(comp); comp.connect(limiter); limiter.connect(clip); clip.connect(outGain); outGain.connect(destination);

    // musica: mixBus -> tilt -> powerLP -> powerGain -> musOut -> saturacion -> sfxSum
    const mixBus = gainN(0.3);
    const tilt = filt('highshelf', 3500, 0.7); tilt.gain.value = -2;
    const powerLP = filt('lowpass', 18000, 0.9);
    const powerGain = gainN(1);
    const musOut = gainN(1), levelGain = gainN(0.62);
    const sat = ac.createWaveShaper(); sat.curve = satCurve(1.8); sat.oversample = '2x';
    const satTrim = gainN(0.36);
    mixBus.connect(tilt); tilt.connect(powerLP); powerLP.connect(powerGain); powerGain.connect(levelGain); levelGain.connect(musOut);
    musOut.connect(sat); sat.connect(satTrim); satTrim.connect(sfxSum);

    // bombo (no le afecta el pump), con su saturacion y su puerta de corriente
    const kickShaper = ac.createWaveShaper(); kickShaper.curve = satCurve(2.6);
    const kickGate = gainN(1);
    const kickClickBus = filt('highpass', 1800, 0.7);
    kickShaper.connect(kickGate); kickClickBus.connect(kickGate); kickGate.connect(mixBus);

    // pump (sidechain falso): todo lo tonal pasa por aqui
    const pump = gainN(1); pump.connect(mixBus);

    // bajo
    const bassFilt = filt('lowpass', 600, 3.5);
    const bassBus = gainN(0.55); bassFilt.connect(bassBus); bassBus.connect(pump);
    const bassSubBus = gainN(0.55); bassSubBus.connect(pump);

    // delay ping-pong (corchea con puntillo) y reverb corta
    const dlyIn = gainN(1);
    const dlyL = ac.createDelay(1), dlyR = ac.createDelay(1);
    dlyL.delayTime.value = STEP * 3; dlyR.delayTime.value = STEP * 3;
    const fbLP = filt('lowpass', 2600, 0.5), fbGain = gainN(0.4);
    const dlyPanL = panN(-0.75), dlyPanR = panN(0.75), dlyOut = gainN(0.8);
    dlyIn.connect(dlyL); dlyL.connect(dlyPanL); dlyPanL.connect(dlyOut);
    dlyL.connect(fbLP); fbLP.connect(dlyR); dlyR.connect(dlyPanR); dlyPanR.connect(dlyOut);
    dlyR.connect(fbGain); fbGain.connect(dlyL);
    dlyOut.connect(mixBus);
    const revIn = gainN(1);
    const conv = ac.createConvolver(); conv.buffer = makeIR(0.9, 0.35);
    const revOut = gainN(0.55);
    revIn.connect(conv); conv.connect(revOut); revOut.connect(mixBus);

    // acordes (stab): dos filtros (izq/der) con la misma envolvente
    const stabFL = filt('lowpass', 1200, 4), stabFR = filt('lowpass', 1200, 4);
    const stabPL = panN(-0.55), stabPR = panN(0.55);
    const stabBus = gainN(0.24);
    stabFL.connect(stabPL); stabFR.connect(stabPR); stabPL.connect(stabBus); stabPR.connect(stabBus);
    stabBus.connect(pump);
    const stabSendD = gainN(0.55), stabSendR = gainN(0.18);
    stabBus.connect(stabSendD); stabSendD.connect(dlyIn); stabBus.connect(stabSendR); stabSendR.connect(revIn);

    // acid 303: la voz es un oscilador persistente (se crea en start) -> filtro resonante -> vca -> distorsion
    const acidFilt = filt('lowpass', 800, 13);
    const acidVca = gainN(0);
    const acidDist = ac.createWaveShaper(); acidDist.curve = satCurve(2.4);
    const acidOut = gainN(0.28);
    const acidHP = filt('highpass', 120, 0.7);
    acidFilt.connect(acidVca); acidVca.connect(acidDist); acidDist.connect(acidHP); acidHP.connect(acidOut); acidOut.connect(pump);
    const acidSend = gainN(0.28); acidOut.connect(acidSend); acidSend.connect(dlyIn);

    // gancho de feria (organillo/caliope)
    const leadHP = filt('highpass', 330, 0.7), leadLP = filt('lowpass', 4300, 2.2);
    const leadBus = gainN(0.2);
    leadHP.connect(leadLP); leadLP.connect(leadBus); leadBus.connect(pump);
    const leadSendD = gainN(0.32), leadSendR = gainN(0.3);
    leadBus.connect(leadSendD); leadSendD.connect(dlyIn); leadBus.connect(leadSendR); leadSendR.connect(revIn);

    // percusion
    const hatBus = filt('highpass', 7000, 0.7), hatOut = gainN(0.27), hatPan = panN(0.25);
    hatBus.connect(hatOut); hatOut.connect(hatPan); hatPan.connect(mixBus);
    const clapBP = filt('bandpass', 1500, 0.9), clapOut = gainN(0.7);
    clapBP.connect(clapOut); clapOut.connect(mixBus);
    const clapSendR = gainN(0.3); clapOut.connect(clapSendR); clapSendR.connect(revIn);
    const crashBus = filt('highpass', 4500, 0.7), crashOut = gainN(0.4);
    crashBus.connect(crashOut); crashOut.connect(mixBus);
    const crashSendR = gainN(0.4); crashOut.connect(crashSendR); crashSendR.connect(revIn);
    const riserBP = filt('bandpass', 500, 2.5), riserOut = gainN(0.9);
    riserBP.connect(riserOut); riserOut.connect(mixBus);

    // zumbido electrico y crepitar de "sin corriente" (fuera del filtro de corriente)
    const humLP = filt('lowpass', 900, 0.7), humGain = gainN(0), humBP = filt('peaking', 300, 1.0);
    humBP.gain.value = 6;
    humLP.connect(humBP); humBP.connect(humGain); humGain.connect(sfxSum);

    // efectos
    const sfxBus = gainN(0.6); sfxBus.connect(sfxSum);
    const sparkHP = filt('highpass', 2500, 0.7); sparkHP.connect(sfxBus);

    // ------------------------------------------------------------------ estado
    let running = false, dead = false, timer = null;
    let nextTime = 0, stepIdx = 0, secBase = 0, hookUntil = 0, hookOn = false, acidOn = false;
    let inten = 0.1, power = 1, lastPower = -1, lastInten = -1;
    let pitchCS = null, lfo = null, lfoDepth = null, acidOsc = null, humA = null, humB = null, humSrcs = [];
    let acidPrevF = 0, acidGateOpen = false, bigNext = false;

    // ------------------------------------------------------------------ utilidades de voces
    function connectPitch(o) { if (pitchCS) pitchCS.connect(o.detune); }

    function noise(t, dur, dest, offset) {
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      s.connect(dest);
      s.start(t, offset != null ? offset : Math.random() * (NOISE_LEN - dur - 0.05), dur);
      return s;
    }
    function perc(dest, t, peak, atk, dec) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dec);
      g.connect(dest);
      return g;
    }
    function osc(type, f, t, tEnd, dest, detune, pitched) {
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (detune) o.detune.value = detune;
      if (pitched !== false) connectPitch(o);
      o.connect(dest); o.start(t); o.stop(tEnd);
      return o;
    }
    function pumpHit(t, depth) {
      const g = pump.gain;
      g.setValueAtTime(depth, t);
      g.setTargetAtTime(1, t + 0.012, 0.085);
    }

    // ------------------------------------------------------------------ instrumentos
    function kick(t, vel, big) {
      const o = ac.createOscillator(); o.type = 'sine';
      const g = ac.createGain();
      o.frequency.setValueAtTime(big ? 230 : 185, t);
      o.frequency.setTargetAtTime(big ? 44 : 49, t, big ? 0.05 : 0.04);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + 0.002);
      g.gain.setValueAtTime(vel, t + (big ? 0.16 : 0.1));
      g.gain.setTargetAtTime(0, t + (big ? 0.16 : 0.1), big ? 0.09 : 0.065);
      connectPitch(o);
      o.connect(g); g.connect(kickShaper);
      o.start(t); o.stop(t + (big ? 0.8 : 0.5));
      const gc = perc(kickClickBus, t, 0.5 * vel, 0.0006, 0.014);
      noise(t, 0.03, gc);
    }

    function hat(t, vel, open) {
      const dec = open ? 0.16 : 0.035;
      const g = perc(hatBus, t, vel, 0.001, dec);
      noise(t, dec + 0.03, g);
    }

    function clap(t, vel) {
      // tres golpes rapidos + cola
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      const offs = [0, 0.011, 0.023];
      for (let i = 0; i < 3; i++) {
        g.gain.linearRampToValueAtTime(vel * (0.7 + 0.15 * i), t + offs[i] + 0.0015);
        g.gain.exponentialRampToValueAtTime(vel * 0.12, t + offs[i] + 0.009);
      }
      g.gain.linearRampToValueAtTime(vel, t + 0.026);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      g.connect(clapBP);
      noise(t, 0.23, g);
    }

    function crash(t, vel, dec) {
      const g = perc(crashBus, t, vel, 0.002, dec);
      noise(t, Math.min(dec + 0.05, NOISE_LEN - 0.1), g, 0.1);
      // parciales metalicos
      const g2 = perc(crashBus, t, vel * 0.5, 0.002, dec * 0.7);
      const F = [263, 400, 421, 474, 587, 845];
      for (let i = 0; i < F.length; i++) osc('square', F[i] * 2.2, t, t + dec * 0.7 + 0.05, g2, 0, false);
    }

    function riser(t, dur) {
      riserBP.frequency.cancelScheduledValues(t);
      riserBP.frequency.setValueAtTime(400, t);
      riserBP.frequency.exponentialRampToValueAtTime(9000, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + dur);
      g.gain.linearRampToValueAtTime(0, t + dur + 0.02);
      g.connect(riserBP);
      noise(t, Math.min(dur + 0.05, NOISE_LEN - 0.1), g, 0.2);
    }

    function bassNote(t, f, vel, cut, len) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + 0.004);
      g.gain.setValueAtTime(vel, t + len);
      g.gain.setTargetAtTime(0, t + len, 0.02);
      const end = t + len + 0.12;

      osc('sawtooth', f, t, end, g, 5);
      g.connect(bassFilt);
      bassFilt.frequency.setValueAtTime(cut * 3.2, t);
      bassFilt.frequency.setTargetAtTime(cut, t, 0.05);
      const gs = ac.createGain();
      gs.gain.setValueAtTime(0, t);
      gs.gain.linearRampToValueAtTime(vel * 0.9, t + 0.006);
      gs.gain.setValueAtTime(vel * 0.9, t + len);
      gs.gain.setTargetAtTime(0, t + len, 0.02);
      osc('sine', f, t, end, gs);
      gs.connect(bassSubBus);

    const CHORDS = [
      { root: 41, notes: [53, 56, 60, 63] },   // Fm7
      { root: 37, notes: [49, 53, 56, 60] },   // Dbmaj7
      { root: 44, notes: [56, 60, 63, 67] },   // Abmaj7
      { root: 39, notes: [51, 55, 58, 65] }    // Eb add9
    ];

    function stab(t, chord, cut, vel, len) {
      const end = t + len + 0.15;

        const left = (i % 2 === 0);
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vel, t + 0.006);
        g.gain.setValueAtTime(vel, t + len * 0.5);
        g.gain.setTargetAtTime(0, t + len * 0.5, len * 0.28);
        const f = mtof(chord.notes[i]);

        g.connect(left ? stabFL : stabFR);

    // acid: patron de 16 pasos [semitonos sobre la fundamental, acento, slide]
    const ACID = [
      [0, 1, 0], [0, 0, 0], [12, 0, 0], [12, 0, 1],
      null, [0, 0, 0], [3, 1, 1], [7, 0, 0],
      [0, 1, 0], null, [12, 0, 0], [10, 0, 1],
      [7, 0, 0], [0, 0, 0], [3, 1, 1], [0, 0, 0]
    ];
    function acidStep(t, s, root) {
      const n = ACID[s];
      if (!n) { return; }
      const f = mtof(root + 12 + n[0]);
      const acc = n[1], slide = n[2];
      const nextN = ACID[(s + 1) % 16];
      const nextSlide = nextN && nextN[2];

        acidOsc.frequency.exponentialRampToValueAtTime(f, t + 0.055);

        acidFilt.frequency.setValueAtTime(peak, t);
        acidFilt.frequency.setTargetAtTime(base, t, acc ? 0.12 : 0.085);
      }

      acidPrevF = f;
      if (!nextSlide) {

        acidGateOpen = false;
      } else acidGateOpen = true;
    }

    // gancho de feria: 4 compases sobre Fm - Db - Ab - Eb. [paso global 0..63, nota midi, duracion en pasos]
    const HOOK = [
      // compas 1 (Fm): "ta-ta-taaa ta-ta"
      [0, 72, 2], [3, 72, 1], [4, 75, 2], [6, 72, 2], [8, 68, 2], [10, 72, 2], [12, 70, 1], [13, 68, 1], [14, 67, 2],
      // compas 2 (Db)
      [16, 73, 2], [19, 73, 1], [20, 77, 2], [22, 73, 2], [24, 70, 2], [26, 73, 2], [28, 72, 1], [29, 70, 1], [30, 68, 2],
      // compas 3 (Ab)
      [32, 72, 2], [35, 72, 1], [36, 80, 2], [38, 75, 2], [40, 72, 2], [42, 75, 1], [43, 72, 1], [44, 68, 4],
      // compas 4 (Eb): remate
      [48, 70, 2], [51, 70, 1], [52, 67, 2], [54, 70, 2], [56, 75, 2], [58, 72, 1], [59, 70, 1], [60, 72, 2], [62, 67, 2]
    ];

    function leadNote(t, midi, steps, vel) {
      const f = mtof(midi), len = Math.max(0.07, steps * STEP * 0.88);
      const end = t + len + 0.12;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vel, t + 0.012);
      g.gain.setValueAtTime(vel * 0.85, t + len);
      g.gain.setTargetAtTime(0, t + len, 0.025);
      const a = osc('square', f, t, end, g, -8);
      const b = osc('square', f, t, end, g, 9);
      const c = osc('triangle', f * 2, t, end, g, 0);
      const d = osc('sawtooth', f * 0.5, t, end, g, 3);   // un poco de cuerpo, "fuelle"
      for (const o of [a, b, c, d]) if (lfoDepth) lfoDepth.connect(o.detune);
      g.connect(leadHP);
      // soplido del organillo al atacar
      const gn = perc(leadHP, t, vel * 0.25, 0.002, 0.03);
      noise(t, 0.06, gn);
    }

    // ------------------------------------------------------------------ programacion de un paso (16avo)
    function scheduleStep(t, idx, tape) {
      const bar = Math.floor(idx / 16), s = idx % 16;
      const sec = bar + secBase;
      const chordIdx = bar % 4;
      const chord = CHORDS[chordIdx];
      const I = inten;
      const lowPower = power < 0.08;

      if (!tape) {
        if (s === 0) {
          levelGain.gain.setTargetAtTime(sec < 4 ? 0.62 : sec < 8 ? 0.82 : secBase >= 8 ? 1.12 : 0.95, t, 0.12);
          acidOn = I >= 0.4 || secBase >= 8 && I >= 0.3;
          if (chordIdx === 0) hookOn = idx < hookUntil || I > 0.85;
        }
      }
      if (lowPower) {
        if (!tape && power < 0.4 && Math.random() < (0.4 - power) * 0.35) crackle(t + rnd(0, STEP), 0.4);
        return;
      }
      const rhythm = sec >= 4;
      const peak = secBase >= 8;

      // bombo
      if (s % 4 === 0) {
        kick(t, bigNext ? 1.25 : 0.82, bigNext);
        pumpHit(t, bigNext ? 0.18 : 0.28);
        bigNext = false;
      }
      // bajo
      {
        const root = chord.root;
        const f1 = mtof(root + 12);   // F2...
        if (sec < 4) {
          if (s % 4 === 2) bassNote(t, f1, 0.8, 280 + sec * 90, STEP * 1.6);
        } else {
          const cut = 520 + I * 900 + (peak ? 250 : 0);
          if (s % 4 === 2) bassNote(t, f1, 0.9, cut, STEP * 1.5);
          else if (s % 4 === 3) bassNote(t, f1 * 2, 0.5, cut, STEP * 0.8);
          else if (s % 4 === 1 && (I > 0.5 || peak)) bassNote(t, f1, 0.45, cut, STEP * 0.7);
        }
      }
      if (rhythm) {
        // charles abiertos a contratiempo
        if (s % 4 === 2) hat(t, 0.75 + (peak ? 0.1 : 0), true);
        // charles cerrados: mas densos con la intensidad
        if (s % 2 === 1 && (I >= 0.3 || sec >= 8)) hat(t, 0.28 + I * 0.25 + rnd(-0.03, 0.03), false);
        if (s % 4 === 0 && (I >= 0.6 || peak)) hat(t, 0.2, false);
        if (s % 4 === 3 && I >= 0.75) hat(t, 0.22, false);
        // palmas en 2 y 4
        if (s === 4 || s === 12) clap(t, 0.8);
        if (s === 15 && (I >= 0.7 || peak)) clap(t, 0.25);
        // relleno de palmas al final de cada 4 compases en la zona de subidon
        if (peak && chordIdx === 3 && s >= 12) clap(t, 0.35 + 0.15 * (s - 12));
        // acordes
        const cut = 750 + I * 2600 + (peak ? 500 : 0);
        const sp = (I >= 0.5 || sec >= 8) ? [3, 6, 10, 13] : [3, 10];
        if (sp.indexOf(s) >= 0) stab(t, chord, cut, 0.8, STEP * 2.2);
      }
      // entrada: crash suave al empezar el ritmo
      if (s === 0 && sec === 4 && !tape && secBase === 0) crash(t, 0.45, 1.2);
      // subida de ruido en el compas anterior
      if (s === 0 && sec === 3 && !tape && secBase === 0) riser(t, BAR);
      // acid
      if (acidOn && !tape) {
        acidStep(t, s, chord.root);
      }
      // gancho
      if (hookOn && !tape) {
        const h = HOOK_BY_STEP[(chordIdx * 16) + s];
        if (h) leadNote(t, h[1], h[2], 0.9);
      }
    }

    // crepitar de red sin corriente
    function crackle(t, vel) {
      const g = perc(sparkHP, t, vel * rnd(0.3, 1), 0.0005, rnd(0.004, 0.012));
      noise(t, 0.02, g);
    }

    // ------------------------------------------------------------------ planificador
    function scheduleUntil(t) {
      if (!running || dead) return;
      while (nextTime < t) {
        scheduleStep(nextTime, stepIdx, false);
        stepIdx++;
        nextTime += STEP;
      }
    }
    function tick() {
      if (!running) return;
      const n = now();
      // si la pestana se durmio, salta lo perdido en vez de disparar todo de golpe
      while (nextTime < n - 0.25) { stepIdx++; nextTime += STEP; }
      scheduleUntil(n + LOOK);
    }

    // ------------------------------------------------------------------ control
    function applyPower(t, instant) {
      const p = power;
      const set = (param, v, tc) => {
        param.cancelScheduledValues(t);
        if (instant) param.setValueAtTime(v, t); else param.setTargetAtTime(v, t, tc);
      };
      set(powerLP.frequency, 100 * Math.pow(180, p), 0.05);
      set(powerGain.gain, 0.04 + 0.96 * Math.pow(p, 1.3), 0.1);
      set(kickGate.gain, clamp((p - 0.25) / 0.5, 0, 1), 0.05);
      set(humGain.gain, 0.035 * Math.pow(1 - p, 2), 0.12);
      if (pitchCS) set(pitchCS.offset, -950 * Math.pow(1 - p, 1.4), 0.18);
      lastPower = p;
    }
    function applyIntensity(t) {
      tilt.gain.cancelScheduledValues(t);
      tilt.gain.setTargetAtTime(-3 + 6 * inten, t, 0.4);
      lastInten = inten;
    }

    function buildVoices(t) {
      pitchCS = ac.createConstantSource(); pitchCS.offset.value = 0; pitchCS.start(t);
      lfo = ac.createOscillator(); lfo.frequency.value = 5.3; lfoDepth = gainN(11); lfo.connect(lfoDepth); lfo.start(t);
      acidOsc = ac.createOscillator(); acidOsc.type = 'sawtooth'; acidOsc.frequency.value = 87;
      connectPitch(acidOsc); acidOsc.connect(acidFilt); acidOsc.start(t);
      humA = ac.createOscillator(); humA.type = 'sawtooth'; humA.frequency.value = 50;
      humB = ac.createOscillator(); humB.type = 'square'; humB.frequency.value = 100.4;
      const hb = gainN(0.4); humA.connect(humLP); humB.connect(hb); hb.connect(humLP);
      humA.start(t); humB.start(t);
      humSrcs = [pitchCS, lfo, acidOsc, humA, humB];
    }
    function killVoices(t) {
      for (const s of humSrcs) { try { s.stop(t); } catch (e) { /* ya parado */ } }
      humSrcs = []; pitchCS = null; lfoDepth = null;
    }

    function start(t) {
      t = t == null ? now() : t;
      if (running) { if (!dead) return; killVoices(t); }
      if (timer) { clearInterval(timer); timer = null; }
      running = true; dead = false; bigNext = false;
      buildVoices(t);
      musOut.gain.cancelScheduledValues(t); musOut.gain.setValueAtTime(1, t);
      pump.gain.cancelScheduledValues(t); pump.gain.setValueAtTime(1, t);
      acidVca.gain.cancelScheduledValues(t); acidVca.gain.setValueAtTime(0, t);
      levelGain.gain.cancelScheduledValues(t); levelGain.gain.setValueAtTime(0.62, t);
      acidGateOpen = false; secBase = 0; hookUntil = 0; hookOn = false; acidOn = false;
      stepIdx = 0; nextTime = t + 0.06;
      applyPower(t, true); applyIntensity(t);
      if (!manual) {
        timer = setInterval(tick, TICK_MS);
        tick();
      }
    }

    function stop(t) {
      t = t == null ? now() : t;
      if (!running) return;
      running = false;
      if (timer) { clearInterval(timer); timer = null; }
      musOut.gain.cancelScheduledValues(t);
      musOut.gain.setTargetAtTime(0, t, 0.03);
      humGain.gain.cancelScheduledValues(t); humGain.gain.setTargetAtTime(0, t, 0.03);
      acidVca.gain.cancelScheduledValues(t); acidVca.gain.setTargetAtTime(0, t, 0.02);
      killVoices(t + 0.3);
    }

    function setIntensity(x, t) {
      inten = clamp(+x || 0, 0, 1);
      if (Math.abs(inten - lastInten) > 0.02 && running) applyIntensity(t == null ? now() : t);
    }
    function setPower(x, t) {
      power = clamp(+x || 0, 0, 1);
      if (dead || !running) return;
      if (Math.abs(power - lastPower) < 0.004) return;
      applyPower(t == null ? now() : t, false);
    }

    function drop(t) {
      t = t == null ? now() : t;
      if (!running) { start(t); }
      dead = false; power = 1;
      const t0 = t + GAP;
      // corte seco: la musica programada de antes se silencia y todo vuelve en el tiempo fuerte
      musOut.gain.cancelScheduledValues(t);
      musOut.gain.setValueAtTime(1, t);
      musOut.gain.linearRampToValueAtTime(0, t + 0.004);
      musOut.gain.setValueAtTime(0, t0 - 0.002);
      musOut.gain.linearRampToValueAtTime(1.15, t0);
      musOut.gain.setTargetAtTime(1, t0 + 0.05, 0.4);
      humGain.gain.cancelScheduledValues(t); humGain.gain.setValueAtTime(0, t);
      applyPower(t0 - 0.002, true);
      if (pitchCS) { pitchCS.offset.cancelScheduledValues(t); pitchCS.offset.setValueAtTime(0, t0 - 0.002); }
      pump.gain.cancelScheduledValues(t); pump.gain.setValueAtTime(1, t0 - 0.002);
      acidVca.gain.cancelScheduledValues(t); acidVca.gain.setValueAtTime(0, t); acidGateOpen = false;
      // nueva rejilla: compas 1 de la zona de subidon, con el gancho de feria
      levelGain.gain.cancelScheduledValues(t); levelGain.gain.setValueAtTime(1.12, t0 - 0.002);
      stepIdx = 0; nextTime = t0; secBase = 8; hookUntil = 16 * 8; hookOn = true; acidOn = true;
      if (inten < 0.8) { inten = 0.85; applyIntensity(t0); }
      // impacto: bombo grande, golpe grave, platillo
      bigNext = true;
      const g = perc(kickShaper, t0, 0.9, 0.003, 0.9);
      osc('sine', 62, t0, t0 + 1.0, g, 0, false).frequency.exponentialRampToValueAtTime(34, t0 + 0.9);
      crash(t0, 1.0, 2.2);
      clap(t0, 0.9);
    }

    function death(t) {
      t = t == null ? now() : t;
      if (!running || dead) return;
      const D = 1.2;
      // tape-stop: lo que queda por sonar se estira (tempo y tono caen), la corriente se va
      const inv = (m) => 1 - Math.pow(Math.max(0, 1 - 2.5 * m / D), 0.4);
      let n = 0;
      for (;;) {
        const m = nextTime + n * STEP - t;
        if (m >= D / 2.5 - 0.02) break;
        const rt = t + inv(Math.max(0, m));
        scheduleStep(rt, stepIdx + n, true);
        n++;
      }
      dead = true;
      if (pitchCS) {
        const N = 48, c = new Float32Array(N);
        for (let i = 0; i < N; i++) {
          const u = i / (N - 1), r = Math.max(Math.pow(1 - u, 1.5), 0.015);
          c[i] = 1200 * Math.log2(r);
        }
        pitchCS.offset.cancelScheduledValues(t);
        pitchCS.offset.setValueCurveAtTime(c, t, D);
      }
      powerLP.frequency.cancelScheduledValues(t);
      powerLP.frequency.setValueAtTime(Math.max(300, 100 * Math.pow(180, power)), t);
      powerLP.frequency.exponentialRampToValueAtTime(110, t + D);
      musOut.gain.cancelScheduledValues(t);
      musOut.gain.setValueAtTime(1, t);
      musOut.gain.setTargetAtTime(0, t + 0.7, 0.2);
      acidVca.gain.setTargetAtTime(0, t + 0.5, 0.1);
      // acorde sostenido que se arrastra hacia abajo con la cinta (es lo que se oye caer de tono)
      {
        const ch = CHORDS[Math.floor(stepIdx / 16) % 4];
        const gd2 = ac.createGain();
        gd2.gain.setValueAtTime(0, t);
        gd2.gain.linearRampToValueAtTime(1.1, t + 0.03);
        gd2.gain.setValueAtTime(1.1, t + 0.5);
        gd2.gain.setTargetAtTime(0, t + 0.5, 0.2);
        const lpd = filt('lowpass', 2200, 0.8); lpd.connect(gd2); gd2.connect(mixBus);
        for (const m of ch.notes) { osc('sawtooth', mtof(m), t, t + D + 0.1, lpd, -6); osc('sawtooth', mtof(m), t, t + D + 0.1, lpd, 7); }
        const gb2 = ac.createGain(); gb2.gain.setValueAtTime(0.9, t); gb2.gain.setTargetAtTime(0, t + 0.5, 0.2); gb2.connect(mixBus);
        osc('sine', mtof(ch.root + 12), t, t + D + 0.1, gb2);
      }
      humGain.gain.cancelScheduledValues(t); humGain.gain.setValueAtTime(0, t);
      // golpe final
      const gb = perc(sfxBus, t, 1.0, 0.002, 0.7);
      const o = osc('sine', 120, t, t + 0.8, gb, 0, false); o.frequency.exponentialRampToValueAtTime(26, t + 0.55);
      const gn = perc(sfxBus, t, 0.6, 0.001, 0.2);
      const lp = filt('lowpass', 1800, 0.7); lp.connect(gn); noise(t, 0.25, lp);
      const gd = perc(sfxBus, t, 0.35, 0.001, 0.12);
      osc('square', 55, t, t + 0.16, gd, 0, false);
    }

    // ------------------------------------------------------------------ efectos cortos (no pasan por el filtro de corriente)
    function chispa(t) {
      t = t == null ? now() : t;
      const k = 7 + Math.floor(Math.random() * 4);
      for (let i = 0; i < k; i++) {
        const tt = t + Math.pow(Math.random(), 1.3) * 0.28;
        const g = perc(sparkHP, tt, rnd(0.25, 0.8), 0.0004, rnd(0.003, 0.014));
        noise(tt, 0.03, g);
      }
      // zumbido que se entrecorta
      const g = ac.createGain(); g.gain.setValueAtTime(0, t);
      for (let i = 0; i < 20; i++) g.gain.setValueAtTime(Math.random() < 0.6 ? rnd(0.08, 0.22) : 0, t + i * 0.012);
      g.gain.setValueAtTime(0, t + 0.25);
      const bp = filt('bandpass', 1900, 1.2); bp.connect(g); g.connect(sfxBus);
      osc('sawtooth', 97, t, t + 0.26, bp, 0, false);
      // zap
      const gz = perc(sfxBus, t, 0.22, 0.002, 0.09);
      osc('sine', 4200, t, t + 0.12, gz, 0, false).frequency.exponentialRampToValueAtTime(240, t + 0.08);
    }

    function bocina(t) {
      t = t == null ? now() : t;
      const honks = [[0, 330, 0.15], [0.2, 415, 0.2]];     // "mec ... meeec", la segunda mas aguda y larga
      for (const h of honks) {
        const tt = t + h[0], f = h[1], d = h[2];
        const g = ac.createGain();
        g.gain.setValueAtTime(0, tt);
        g.gain.linearRampToValueAtTime(0.5, tt + 0.008);
        g.gain.setValueAtTime(0.5, tt + d);
        g.gain.linearRampToValueAtTime(0, tt + d + 0.03);
        const bp = filt('bandpass', 1050, 1.6), bp2 = filt('peaking', 2300, 2); bp2.gain.value = 8;
        bp.connect(bp2); bp2.connect(g); g.connect(sfxBus);
        for (const det of [0, 14]) {
          const o = osc('sawtooth', f * 0.82, tt, tt + d + 0.05, bp, det, false);
          o.frequency.exponentialRampToValueAtTime(f, tt + 0.045);   // el "scoop" del "mec"
        }
        osc('square', f * 0.5, tt, tt + d + 0.05, bp, 0, false).frequency.setValueAtTime(f * 0.5, tt);
      }
    }

    function ficha(t) {
      t = t == null ? now() : t;
      const g1 = ac.createGain();
      g1.gain.setValueAtTime(0.0001, t); g1.gain.linearRampToValueAtTime(0.22, t + 0.003); g1.gain.setValueAtTime(0.22, t + 0.07); g1.gain.linearRampToValueAtTime(0, t + 0.075);
      osc('square', 987.8, t, t + 0.08, g1, 0, false);
      const g2 = perc(sfxBus, t + 0.075, 0.24, 0.003, 0.45);
      osc('square', 1318.5, t + 0.075, t + 0.55, g2, 0, false);
      const g3 = perc(sfxBus, t + 0.075, 0.1, 0.002, 0.5);
      osc('sine', 1318.5 * 2.76, t + 0.075, t + 0.6, g3, 0, false);
      const hp = filt('highpass', 600, 0.7); hp.connect(sfxBus); g1.disconnect(); g1.connect(hp);
    }

    function topetazo(t) {
      t = t == null ? now() : t;
      const g = perc(sfxBus, t, 1.0, 0.002, 0.28);
      osc('sine', 190, t, t + 0.32, g, 0, false).frequency.exponentialRampToValueAtTime(48, t + 0.14);
      const gn = perc(sfxBus, t, 0.7, 0.001, 0.09);
      const lp = filt('lowpass', 700, 0.8); lp.connect(gn); noise(t, 0.12, lp);
      // el "boing" de la goma
      const gb = perc(sfxBus, t + 0.02, 0.28, 0.004, 0.22);
      const ob = osc('triangle', 300, t + 0.02, t + 0.27, gb, 0, false);
      ob.frequency.exponentialRampToValueAtTime(120, t + 0.24);
      const vib = ac.createOscillator(); vib.frequency.value = 26;
      const vg = gainN(40); vib.connect(vg); vg.connect(ob.frequency); vib.start(t); vib.stop(t + 0.3);
    }

    return {
      start, stop, setIntensity, setPower, drop, death,
      chispa, bocina, ficha, topetazo,
      scheduleUntil, LOOK, BPM, BAR, STEP
    };
  }

  // ---------- sound: the techno engine above plus a few loose effects. Everything is synthesized, no assets ----------
  // Life of the music: sound.musica() starts a clean engine on the click that plays (autoplay policy), a new one for every run; sound.pausar() suspends
  // the whole context (nothing is left scheduled to pile up, and resuming continues right where it was); sound.cerrarMusica() drops the engine after the
  // tape-stop of a death. The engine's own scheduler (setInterval) is cleared by T.stop(), so there is never more than one running.
  const sound = (() => {
    let ac = null, master, fx, noiseBuf, T = null, musicBus = null, hum = null, lastHum = 0;
    let muted = false;
    try { muted = localStorage.getItem('voycolgao-muted') === '1'; } catch { /* storage blocked */ }

    function wake() {
      try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch { /* no resume */ }
    }

    function init() {
      if (ac) { if (ac.state !== 'running') wake(); return; }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      ac = new AudioCtx();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.8;
      master.connect(ac.destination);
      fx = ac.createGain();                   // the loose effects (landing, dry zap, hum), a bit under the music
      fx.gain.value = 0.55;
      fx.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      wake();
    }

    // A run starts: the old engine (if any) fades out and a new one starts from the top.
    function musica() {
      if (!ac) return;
      soltarMusica(0.12);
      musicBus = ac.createGain();
      musicBus.connect(master);
      // Without music the game still plays (an old browser missing some node type).
      try { T = createTechno(ac, musicBus); T.start(); } catch { T = null; }
    }
    function soltarMusica(fade) {
      if (!T) return;
      const oldT = T, oldBus = musicBus;
      T = null; musicBus = null;
      const now = ac.currentTime;
      oldBus.gain.cancelScheduledValues(now);
      oldBus.gain.setTargetAtTime(0, now, fade / 3);
      oldT.stop();
      setTimeout(() => { try { oldBus.disconnect(); } catch { /* already gone */ } }, 1500);
    }
    // After a death the tape-stop lasts ~1.3 s; then the engine is dropped (and its scheduler stops ticking for nothing).
    function cerrarMusica() {
      const mine = T;
      if (!mine) return;
      setTimeout(() => { if (T === mine) soltarMusica(0.2); }, 1600);
    }
    function pausar() {
      if (!ac || ac.state !== 'running') return;
      try { const p = ac.suspend(); if (p && p.catch) p.catch(() => {}); } catch { /* no suspend */ }
    }

    function tone(type, f0, f1, dur, vol) {
      if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, now);
      osc.frequency.exponentialRampToValueAtTime(f1, now + dur);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain).connect(fx);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function burst(freq, dur, vol) {
      if (!ac) return;
      const now = ac.currentTime;
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = freq;
      const gain = ac.createGain();
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filter).connect(gain).connect(fx);
      src.start(now, Math.random() * 1.5);
      src.stop(now + dur + 0.02);
    }

    // A soft electric hum while the pen draws: two detuned oscillators through a low-pass, created the first time it is needed.
    function makeHum() {
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 600;
      filter.Q.value = 2;
      const gain = ac.createGain();
      gain.gain.value = 0;
      const a = ac.createOscillator(); a.type = 'sawtooth'; a.frequency.value = 62;
      const b = ac.createOscillator(); b.type = 'square'; b.frequency.value = 124.6;
      const bg = ac.createGain(); bg.gain.value = 0.35;
      a.connect(filter); b.connect(bg); bg.connect(filter);
      filter.connect(gain); gain.connect(fx);
      a.start(); b.start();
      return { filter, gain };
    }

    return {
      init, musica, pausar, cerrarMusica,
      isMuted: () => muted,
      toggleMute() {
        muted = !muted;
        try { localStorage.setItem('voycolgao-muted', muted ? '1' : '0'); } catch { /* storage blocked */ }
        if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.05);
      },
      zumbido(level) {
        if (!ac) return;
        if (Math.abs(level - lastHum) < 0.03 && level > 0) return;
        if (level <= 0 && !hum) { lastHum = 0; return; }
        lastHum = level;
        if (!hum) hum = makeHum();
        hum.gain.gain.setTargetAtTime(level * 0.09, ac.currentTime, 0.06);
        hum.filter.frequency.setTargetAtTime(450 + level * 900, ac.currentTime, 0.08);
      },
      // The engine's own voices: contact of the hook, zap on hooking again, sparks, token, caught, horn, death.
      power(level) { if (T) T.setPower(level); },
      intensity(level) { if (T) T.setIntensity(level); },
      reenganche() { if (T) T.drop(); },
      chispa() { if (T) T.chispa(); },
      ficha() { if (T) T.ficha(); },
      bocina() { if (T) T.bocina(); },
      topetazo() { if (T) { T.topetazo(); T.death(ac.currentTime + 0.15); } },
      death() { if (T) T.death(); },
      splat(power) { burst(900, 0.16, 0.5 * power); tone('sine', 150, 60, 0.12, 0.3 * power); },
      dry() { burst(1300, 0.08, 0.12); tone('sine', 150, 110, 0.09, 0.05); },
    };
  })();

  // ---------- viewport ----------
  let dpr = 1, cssW = 0, cssH = 0, scale = 1, offY = 0, viewW = 0;
  let visTop = 0, visBottom = C.WORLD_H;
  // camY is the world y at the top of the screen. When the whole world height fits, it just centers it;
  // on short screens (phones in landscape) it follows the hook vertically and always keeps some floor in sight.
  let camY = 0, viewH = C.WORLD_H, followY = false, camYMax = 0;
  let assetsTimer = 0;

  function camYTarget() {
    // A little look-ahead when falling, so the floor comes into view before the car reaches it.
    const ahead = drop && drop.vy > 0 ? Math.min(90, drop.vy * 0.18) : 0;
    return clamp(drop.y + ahead - viewH * C.CAM_HOOK_Y, -30, camYMax);
  }
  function applyCamY() {
    offY = -camY * scale;
    visTop = camY;
    visBottom = camY + viewH;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = canvas.clientWidth;
    cssH = canvas.clientHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const isPortrait = cssW < cssH;
    const isPhone = Math.min(cssW, cssH) < 520;
    // Portrait phones get a narrower world view; landscape phones a shorter one, so the car isn't microscopic.
    const minViewW = isPortrait ? 520 : C.MIN_VIEW_W;
    const minViewH = isPhone && !isPortrait ? C.PHONE_VIEW_H : C.WORLD_H;
    scale = Math.min(cssH / minViewH, cssW / minViewW);
    hintEl.hidden = !(isPortrait && state === 'title');
    viewW = cssW / scale;
    viewH = cssH / scale;
    followY = viewH < C.WORLD_H - 1;
    camYMax = Math.max(-30, C.FLOOR_Y + C.FLOOR_PAD - viewH);
    camY = followY && drop ? camYTarget() : -(viewH - C.WORLD_H) / 2;
    applyCamY();
    // Pre-rendered layers are rebuilt once the window stops changing size.
    clearTimeout(assetsTimer);
    if (assetsReady) assetsTimer = setTimeout(buildAssets, 160); else buildAssets();
  }

  // ---------- state ----------
  let state = 'title';
  let time = 0, ink = C.INK_MAX, distance = 0;   // "ink" is the cable you can still draw
  let segments = [], strokes = [], cables = [], decor = [], pickups = [], tendrils = [], flyers = [];
  let sparksFx = [], bursts = [], onos = [], cuts = [];
  let shake = 0, danger = 0, barPulse = 0, drawnThisFrame = 0, animT = 0;
  let dryAlert = 0, lastDrySound = 0;
  let power = 1, airTime = 0, sparkAcc = 0, chispaT = 0.6, bocinaT = 2, eatX = -1e9, cutT = 0;
  let dangerS = 0;       // danger, smoothed: it drives the intensity of the music
  // Hidden perf overlay, toggled with D. Stats are averaged over half-second windows.
  const perf = { visible: false, frames: 0, windowStart: 0, updateMs: 0, renderMs: 0, fps: 0, avgUpdate: 0, avgRender: 0, worstFrame: 0, worst: 0 };
  let drop, blob, car, cam, gen;                // drop = the hook, car = the hanging car (drawing only)
  let pen = null, pointer = null;
  // Personal ranking: top RANKING_SIZE runs, kept only in this browser's localStorage.
  const RANKING_SIZE = 10;
  const RANKING_SHOWN = 5;
  let ranking = loadRanking();
  let best = ranking[0]?.m || 0;

  function loadRanking() {
    try {
      const parsed = JSON.parse(localStorage.getItem('voycolgao-ranking') || '[]');
      const runs = Array.isArray(parsed) ? parsed.filter((r) => Number.isFinite(r?.m) && r.m > 0) : [];
      return runs.sort((a, b) => b.m - a.m).slice(0, RANKING_SIZE);
    } catch {
      return [];
    }
  }
  function saveRanking() {
    try { localStorage.setItem('voycolgao-ranking', JSON.stringify(ranking)); } catch { /* storage blocked */ }
  }
  // Returns the run's position in the ranking, or -1 if it didn't make the cut.
  function addRun(meters) {
    if (meters <= 0) return -1;
    const run = { m: meters, at: Date.now() };
    ranking = [...ranking, run].sort((a, b) => b.m - a.m).slice(0, RANKING_SIZE);
    saveRanking();
    best = ranking[0].m;
    return ranking.indexOf(run);
  }

  const dateFmt = new Intl.DateTimeFormat('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  function renderRanking(currentIndex) {
    rankingList.replaceChildren();
    const hasRuns = ranking.length > 0;
    rankingBox.hidden = !hasRuns;
    const shown = ranking.map((run, i) => ({ run, i })).filter(({ i }) => i < RANKING_SHOWN || i === currentIndex);
    for (const { run, i } of shown) {
      const li = document.createElement('li');
      if (i === currentIndex) li.className = 'current';
      const cells = [
        ['rank', `${i + 1}`],
        ['dist', fmtMeters(run.m)],
        ['when', run.at ? dateFmt.format(run.at) : '—'],
      ];
      for (const [cls, text] of cells) {
        const span = document.createElement('span');
        span.className = cls;
        span.textContent = text;
        li.appendChild(span);
      }

      limb(c, [s, [ex, ey], h], 10.5, skin); limb(c, [s, [(s[0] * 2 + ex) / 3, (s[1] * 2 + ey) / 3], [(s[0] + ex) / 2, (s[1] + ey) / 2]], 13, shirt);
      if (gl) { // pulsera luminosa
        c.save(); const px = h[0] + (s[0] - h[0]) * .16, py = h[1] + (s[1] - h[1]) * .16; glow(c, COL.cyan, 8); circle(c, px, py, 6.4); c.strokeStyle = COL.cyan; c.lineWidth = 3.6; c.stroke(); noGlow(c); c.restore();
      }

    };
    arm(sL, armSets.L, 'L');
    // torso
    c.beginPath(); c.moveTo(26, 6); c.quadraticCurveTo(24, -44, 38, -52); c.lineTo(56, -54); c.quadraticCurveTo(70, -44, 66, 6); c.closePath(); fillStroke(c, shirt, 5);
    if (gl) { c.fillStyle = COL.yellow; circle(c, 46, -37, 4.2); c.strokeStyle = OUT; c.lineWidth = 2; c.stroke(); c.beginPath(); c.moveTo(38, -52); c.quadraticCurveTo(46, -34, 56, -54); c.lineWidth = 2.6; c.strokeStyle = '#f0c040'; c.stroke(); }
    c.fillStyle = 'rgba(255,255,255,.2)'; c.beginPath(); c.moveTo(32, -36); c.quadraticCurveTo(31, -20, 33, -6); c.lineTo(38, -6); c.quadraticCurveTo(36, -22, 38, -38); c.fill();
    // cuello+cabeza
    rr(c, 40, -60, 12, 12, 4); fillStroke(c, mix(skin, '#000', .12), 3.5);
    circle(c, hx - R * .98, hy + 3, 4.6); fillStroke(c, skin, 3.5); circle(c, hx + R * .98, hy + 3, 4.6); fillStroke(c, skin, 3.5);
    if (hair === 'afro') hairDraw(c, hair, hairCol, hx, hy, R);
    circle(c, hx, hy, R); fillStroke(c, skin, 5);
    if (hair !== 'afro') hairDraw(c, hair, hairCol, hx, hy, R);
    // cara
    c.fillStyle = mix(skin, '#c0402a', .25); circle(c, hx - R * .62, hy + R * .38, 3.6); c.fill(); circle(c, hx + R * .62, hy + R * .38, 3.6); c.fill();
    // nariz
    circle(c, hx + 1.5, hy + R * .22, 3.4); fillStroke(c, mix(skin, '#c0402a', .15), 2.4);
    const eyeY = hy - 2.5;
    if (expr === 'party') {
      if (shades) shadesDraw(c, hx, eyeY, R, false);
      mouthGrin(c, hx, hy + R * .52, 10);
    } else if (expr === 'scared') {
      // gafas subidas a la frente, ojos como platos
      [-6.6, 6.6].forEach(dx => { circle(c, hx + dx, eyeY + 1, 6.2); fillStroke(c, '#fff', 2.6); circle(c, hx + dx + (dx > 0 ? -1 : 1), eyeY + 1.5, 2.2); c.fillStyle = OUT; c.fill(); });
      if (shades) { c.save(); c.translate(0, -9); c.rotate(-.12); shadesDraw(c, hx, eyeY, R, true); c.restore(); }
      c.beginPath(); c.moveTo(hx - 12, eyeY - 8); c.quadraticCurveTo(hx - 7, eyeY - 12, hx - 3, eyeY - 9); c.moveTo(hx + 3, eyeY - 9); c.quadraticCurveTo(hx + 7, eyeY - 12, hx + 12, eyeY - 8); c.lineWidth = 2.6; c.strokeStyle = OUT; c.stroke();
      ellipseMouth(c, hx, hy + R * .62, 5.5, 7.5);
      // gotas de sudor
      [[-R * 1.15, -R * .5], [R * 1.2, -R * .1]].forEach(d => { c.save(); c.translate(hx + d[0], hy + d[1]); c.beginPath(); c.moveTo(0, -7); c.quadraticCurveTo(6, 2, 0, 6); c.quadraticCurveTo(-6, 2, 0, -7); fillStroke(c, COL.cyan, 2.4); c.restore(); });
    } else if (expr === 'angry') {
      [-6.4, 6.4].forEach(dx => { circle(c, hx + dx, eyeY + 2, 4.6); fillStroke(c, '#fff', 2.4); circle(c, hx + dx * .6 + 1, eyeY + 3, 2); c.fillStyle = OUT; c.fill(); });
      c.beginPath(); c.moveTo(hx - 13, eyeY - 8); c.lineTo(hx - 2, eyeY - 1); c.moveTo(hx + 13, eyeY - 8); c.lineTo(hx + 2, eyeY - 1); c.lineWidth = 4.4; c.strokeStyle = OUT; c.lineCap = 'round'; c.stroke();
      mouthShout(c, hx, hy + R * .58);
      // vena de enfado
      c.save(); c.translate(hx + R * .95, hy - R * 1.05); c.strokeStyle = '#ff2d44'; c.lineWidth = 3; c.lineCap = 'round';
      for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(-3 + i * 7, 0, 4, 0, Math.PI * .5); c.stroke(); c.beginPath(); c.arc(3 - i * 0, 7, 4, Math.PI, Math.PI * 1.5); } c.restore();
    } else if (expr === 'joy') {
      [-6.6, 6.6].forEach(dx => { c.beginPath(); c.arc(hx + dx, eyeY + 2, 4.4, Math.PI * 1.1, Math.PI * 1.9); c.lineWidth = 3.4; c.strokeStyle = OUT; c.lineCap = 'round'; c.stroke(); });
      mouthGrin(c, hx, hy + R * .46, 11.5);
    }
    if (mustache) { c.beginPath(); c.moveTo(hx - 11, hy + R * .38); c.quadraticCurveTo(hx - 4, hy + R * .1, hx, hy + R * .34); c.quadraticCurveTo(hx + 4, hy + R * .1, hx + 11, hy + R * .38); c.quadraticCurveTo(hx + 4, hy + R * .62, hx, hy + R * .44); c.quadraticCurveTo(hx - 4, hy + R * .62, hx - 11, hy + R * .38); fillStroke(c, hairCol === '#2a1a10' ? '#2a1a10' : '#3a2415', 2.6); }
    arm(sR, armSets.R, 'R');
  }
  function shadesDraw(c, hx, ey, R, pushed) {
    rr(c, hx - R * 1.08, ey - 5, R * 2.16, 3.6, 1.8); fillStroke(c, '#0d0620', 2.5);
    [-1, 1].forEach(sd => {
      c.save(); c.translate(hx + sd * 7.2, ey + 1.5);
      c.beginPath(); c.roundRect(-7.4, -6.5, 14.8, 13.5, [3, 3, 8, 8]); fillStroke(c, '#0d0620', 3);
      c.beginPath(); c.moveTo(-4.6, -3.4); c.lineTo(-0.5, -3.4); c.lineTo(-4.4, 1.8); c.closePath(); c.fillStyle = pushed ? '#ffffff' : COL.cyan; c.globalAlpha = .9; c.fill(); c.globalAlpha = 1;
      c.beginPath(); c.moveTo(2.2, -3.4); c.lineTo(4.8, -3.4); c.lineTo(2, 0.4); c.closePath(); c.fillStyle = COL.pink; c.fill();
      c.restore();
    });
  }
  function mouthGrin(c, x, y, w) {
    c.beginPath(); c.moveTo(x - w, y - 2); c.quadraticCurveTo(x, y - 4, x + w, y - 2); c.quadraticCurveTo(x + w * .8, y + w * .95, x, y + w * .95); c.quadraticCurveTo(x - w * .8, y + w * .95, x - w, y - 2); c.closePath(); fillStroke(c, '#7a0f2a', 3);
    c.save(); c.clip(); c.fillStyle = '#fff'; c.fillRect(x - w, y - 3, w * 2, 4.4); c.fillStyle = '#ff6b8a'; circle(c, x, y + w * .95, w * .5); c.fill(); c.restore();
  }
  function ellipseMouth(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); fillStroke(c, '#5a0820', 3); c.fillStyle = '#ff6b8a'; c.beginPath(); c.ellipse(x, y + ry * .45, rx * .6, ry * .35, 0, 0, Math.PI * 2); c.fill(); }
  function mouthShout(c, x, y) {
    c.beginPath(); c.moveTo(x - 10, y + 5); c.quadraticCurveTo(x, y - 6, x + 10, y + 5); c.quadraticCurveTo(x + 6, y + 14, x, y + 14); c.quadraticCurveTo(x - 6, y + 14, x - 10, y + 5); c.closePath(); fillStroke(c, '#5a0820', 3);
    c.save(); c.clip(); c.fillStyle = '#fff'; c.fillRect(x - 10, y - 1, 20, 4); c.fillStyle = '#ff6b8a'; circle(c, x, y + 14, 5); c.fill(); c.restore();
  }

  /* ---- Hook / trolley on the cable: contact wheel on TOP of the cable, yellow yoke around it, plate below the cable. Origin = contact point. ---- */
  function trolley(c, { big = 1 } = {}) {
    c.save(); c.scale(big, big);
    const wr = 14;
    // yoke (yellow arch) that hugs the wheel from above
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-19, 12); c.lineTo(-19, -wr - 2); c.bezierCurveTo(-19, -wr - 28, 19, -wr - 28, 19, -wr - 2); c.lineTo(19, 12);
    c.strokeStyle = OUT; c.lineWidth = 13; c.stroke(); c.strokeStyle = '#ffc23a'; c.lineWidth = 7.5; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-15, -wr - 6); c.bezierCurveTo(-13, -wr - 20, -3, -wr - 23, 6, -wr - 22); c.stroke();
    // plate under the cable, where the pole hangs from
    c.beginPath(); c.moveTo(-17, -2); c.lineTo(17, -2); c.lineTo(17, 17); c.quadraticCurveTo(17, 35, 0, 35); c.quadraticCurveTo(-17, 35, -17, 17); c.closePath();
    fillStroke(c, '#8d98c9', 4.5);
    c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(-12, 10, 4, 14);
    circle(c, 0, 21, 5); fillStroke(c, '#ffc23a', 2.6);
    // wheel in front of everything, so it reads as a wheel
    circle(c, 0, -wr, wr); fillStroke(c, '#e6ebff', 4.5);
    circle(c, 0, -wr, wr * 0.5); fillStroke(c, '#6f79a8', 3);
    c.save(); c.translate(0, -wr);
    for (let i = 0; i < 4; i++) { c.rotate(Math.PI / 4); c.fillStyle = OUT; c.fillRect(-wr * 0.82, -1.3, wr * 1.64, 2.6); }
    c.restore();
    circle(c, 0, -wr, 3); c.fillStyle = '#ffc23a'; c.fill();
    c.beginPath(); c.arc(0, -wr, wr * 0.78, Math.PI * 1.05, Math.PI * 1.4); c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.9)'; c.stroke();
    c.restore();
  }

  /* ---- el coche ----
    o: hx,hy (gancho) | cx,cy (origen del coche); s, L (largo del palo), swing, tilt (inclinacion del cable bajo el gancho),
       body, stripe, num, lit, driver:{...}, beam
  */
  function drawCar(c, o) {
    const { s = 1, L = 150, swing = 0, tilt = 0, body = '#ff2d3d', accent = COL.yellow, num = '7', lit = true, driver = {}, beam: bm = true, hook = true, spark = false, pole = true, bump = '#15131c' } = o;
    c.save();
    if (o.hx !== undefined) { c.translate(o.hx, o.hy); c.rotate(swing); c.scale(s, s); c.translate(0, L); }
    else { c.translate(o.cx, o.cy); c.rotate(o.rot || 0); c.scale(s, s); }
    const bodyC = lit ? body : mix(body, '#1a1030', .55);
    const bodyD = mix(bodyC, '#000000', .3);
    const hi = mix(bodyC, '#ffffff', .35);

    // haz de luz de los faros
    if (lit && bm) {
      c.save(); c.globalCompositeOperation = 'lighter';
      const g = c.createLinearGradient(158, 6, 250, 6); g.addColorStop(0, 'rgba(255,240,150,.55)'); g.addColorStop(1, 'rgba(255,240,150,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(160, 2); c.lineTo(250, -30); c.lineTo(250, 46); c.lineTo(160, 14); c.closePath(); c.fill(); c.restore();
    }
    // brillo inferior (luces de ambiente)
    if (lit) { const g = c.createRadialGradient(65, 62, 0, 65, 62, 90); g.addColorStop(0, rgba(COL.pink, .5)); g.addColorStop(1, rgba(COL.pink, 0)); c.fillStyle = g; c.fillRect(-60, 20, 260, 140); }

    // palo (pertiga)
    if (pole) {
      c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, -L + 8); c.lineTo(0, -8); c.strokeStyle = OUT; c.lineWidth = 12; c.stroke();
      c.strokeStyle = '#c3cbe6'; c.lineWidth = 6; c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-1.5, -L + 20); c.lineTo(-1.5, -20); c.stroke();
      // casquillo aislante negro/amarillo a mitad
      const my = -L * .46; rr(c, -7.5, my, 15, 26, 4); fillStroke(c, '#262033', 3.6);
      c.save(); c.beginPath(); c.rect(-7, my + 1, 14, 24); c.clip(); c.strokeStyle = COL.yellow; c.lineWidth = 4;
      for (let i = -2; i < 6; i++) { c.beginPath(); c.moveTo(-9, my + i * 8); c.lineTo(9, my + i * 8 - 10); c.stroke(); } c.restore();
    }
    // conductor
    drawDriver(c, driver);
    // volante
    c.save(); c.translate(80, -22); c.rotate(-.6);
    c.beginPath(); c.moveTo(0, 22); c.lineTo(0, 0); c.lineWidth = 8; c.strokeStyle = OUT; c.lineCap = 'round'; c.stroke(); c.lineWidth = 3.4; c.strokeStyle = '#6b6f8a'; c.stroke();
    c.beginPath(); c.ellipse(0, 0, 7, 17, 0, 0, Math.PI * 2); c.lineWidth = 10; c.strokeStyle = OUT; c.stroke(); c.lineWidth = 5; c.strokeStyle = '#2a2038'; c.stroke(); c.restore();

    // carroceria superior
    c.beginPath();
    c.moveTo(-32, 36); c.lineTo(-33, 0); c.quadraticCurveTo(-36, -24, -12, -23); c.lineTo(8, -21);
    c.quadraticCurveTo(20, -10, 36, -3); c.lineTo(78, -3); c.quadraticCurveTo(92, -3, 98, -16); c.lineTo(116, -17);
    c.quadraticCurveTo(152, -14, 162, 8); c.lineTo(162, 36); c.closePath();
    fillStroke(c, bodyC, 5.5);
    // sombra inferior y brillo superior
    c.save(); c.clip(); c.fillStyle = bodyD; c.fillRect(-40, 17, 210, 30);
    c.fillStyle = hi; c.globalAlpha = .75; c.beginPath(); c.moveTo(-34, -12); c.quadraticCurveTo(-30, -21, -12, -20); c.lineTo(6, -18); c.lineTo(6, -15); c.lineTo(-12, -16); c.quadraticCurveTo(-26, -16, -29, -6); c.fill();
    c.beginPath(); c.moveTo(106, -13); c.quadraticCurveTo(138, -11, 154, 2); c.lineTo(150, 4); c.quadraticCurveTo(136, -6, 106, -9); c.fill(); c.globalAlpha = 1; c.restore();
    c.beginPath(); c.moveTo(-32, 36); c.lineTo(-33, 0); c.quadraticCurveTo(-36, -24, -12, -23); c.lineTo(8, -21); c.quadraticCurveTo(20, -10, 36, -3); c.lineTo(78, -3); c.quadraticCurveTo(92, -3, 98, -16); c.lineTo(116, -17); c.quadraticCurveTo(152, -14, 162, 8); c.lineTo(162, 36); c.lineWidth = 5.5; c.strokeStyle = OUT; c.stroke();

    // rayo en el capo
    c.save(); c.translate(130, 6);
    c.beginPath(); c.moveTo(6, -17); c.lineTo(-13, 5); c.lineTo(-2, 5); c.lineTo(-8, 21); c.lineTo(14, -4); c.lineTo(2, -4); c.lineTo(10, -17); c.closePath();
    if (lit) glow(c, accent, 10); fillStroke(c, lit ? accent : mix(accent, '#1a1030', .6), 3.6); noGlow(c); c.restore();
    // medallon con numero (puerta)
    circle(c, 56, 12, 11.5); fillStroke(c, lit ? '#fff' : '#9a95b0', 3.6);
    txt(c, num, 56, 13.5, { font: F_TITLE, size: 18, fill: OUT, lw: 0 });

    // parachoques de goma negro grueso
    rr(c, -46, 26, 222, 32, 16); fillStroke(c, bump, 5.5);
    c.save(); rr(c, -46, 26, 222, 32, 16); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(-26, 35); c.lineTo(156, 35); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 3; for (let x = -26; x < 160; x += 22) { c.beginPath(); c.moveTo(x, 40); c.lineTo(x, 55); c.stroke(); }
    c.restore();
    // pastillas de luz del parachoques
    for (let i = 0; i < 5; i++) { const px = -10 + i * 36; if (lit) bulb(c, px + 14, 47, 3.8, BULBS[i % 5], true, 3); else { circle(c, px + 14, 47, 3.6); c.fillStyle = '#3b2a5c'; c.fill(); } }
    // luces de abajo (neon bajo el coche)
    if (lit) { c.save(); glow(c, COL.pink, 16); rr(c, -14, 62, 170, 6, 3); c.fillStyle = COL.pink; c.fill(); noGlow(c); c.restore(); }

    // faro delantero
    circle(c, 161, 12, 10.5); fillStroke(c, lit ? '#fff7b0' : '#6c6788', 4);
    if (lit) { glow(c, COL.yellow, 18); circle(c, 161, 12, 7); c.fillStyle = '#fff'; c.fill(); noGlow(c); }
    // piloto trasero
    rr(c, -37, 4, 10, 20, 4); fillStroke(c, lit ? '#ff2d44' : '#4a1a2a', 3.6);
    if (lit) { glow(c, '#ff2d44', 14); rr(c, -35, 7, 6, 14, 3); c.fillStyle = '#ff7a8a'; c.fill(); noGlow(c); }

    // montaje del palo
    circle(c, 0, -20, 8); fillStroke(c, '#2a2038', 3.6); circle(c, 0, -20, 3); c.fillStyle = '#c3cbe6'; c.fill();

    // gancho arriba
    if (hook && pole) {
      c.save(); c.translate(0, -L); c.rotate(tilt - swing); trolley(c, { lit }); c.restore();
    }
    c.restore();
    // chispas en el contacto
    if (spark && o.hx !== undefined) sparks(c, o.hx, o.hy, { n: 9, len: 36 * s, seed: o.sparkSeed || 3, dir: -Math.PI / 2 + tilt, s: (o.sparkS || Math.max(.6, s)), flash: 12 * (o.sparkS || Math.max(.7, s)) });
  }


  // Fairground backdrop pieces (sketch units, baseline at y = 0).
  function tombolaDraw(c, tx, ty, sil) {
    c.fillStyle = sil; c.fillRect(tx, ty - 160, 240, 160);
    c.beginPath(); c.moveTo(tx - 14, ty - 150); c.lineTo(tx + 120, ty - 250); c.lineTo(tx + 254, ty - 150); c.closePath(); c.fillStyle = '#3a1388'; c.fill();
    for (let i = 0; i < 8; i++) {
      c.beginPath(); c.moveTo(tx + 120, ty - 250); c.lineTo(tx - 14 + i * 33.5, ty - 150); c.lineTo(tx - 14 + (i + 1) * 33.5, ty - 150); c.closePath();
      c.fillStyle = i % 2 ? '#4b1aa0' : mix('#c01c78', '#000000', 0.35); c.fill();
    }
    circle(c, tx + 60, ty - 70, 42); c.fillStyle = '#120a35'; c.fill(); c.lineWidth = 4; c.strokeStyle = '#8a5cff'; c.stroke();
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; c.beginPath(); c.moveTo(tx + 60, ty - 70); c.lineTo(tx + 60 + Math.cos(a) * 42, ty - 70 + Math.sin(a) * 42); c.stroke(); }
    [[tx + 48, ty - 82, COL.yellow], [tx + 72, ty - 60, COL.pink], [tx + 70, ty - 88, COL.cyan], [tx + 50, ty - 56, COL.green]].forEach((b) => bulbSimple(c, b[0], b[1], 5, b[2]));
    rr(c, tx + 118, ty - 120, 108, 40, 8); c.fillStyle = '#240d58'; c.fill(); c.strokeStyle = '#ffb347'; c.lineWidth = 3; c.stroke();
    txt(c, 'TÓMBOLA', tx + 172, ty - 99, { size: 25, fill: '#ffd35a', lw: 0 });
    for (let i = 0; i < 7; i++) bulbSimple(c, tx + 126 + i * 16, ty - 123, 2.6, BULBS[i % 5]);
  }
  function coasterDraw(c, x0, x1, sil) {
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    const yAt = (x) => -150 - 95 * Math.abs(Math.sin((x - x0) * 0.0105)) - 20 * Math.sin((x - x0) * 0.031);
    c.strokeStyle = sil; c.lineWidth = 4;
    for (let x = x0 + 20; x < x1; x += 46) { c.beginPath(); c.moveTo(x, yAt(x)); c.lineTo(x, 20); c.stroke(); }
    c.lineWidth = 8; c.beginPath();
    for (let x = x0; x <= x1; x += 10) x === x0 ? c.moveTo(x, yAt(x)) : c.lineTo(x, yAt(x));
    c.stroke();
    c.strokeStyle = mix(sil, '#6d49c8', 0.4); c.lineWidth = 2; c.beginPath();
    for (let x = x0; x <= x1; x += 10) x === x0 ? c.moveTo(x, yAt(x) - 5) : c.lineTo(x, yAt(x) - 5);
    c.stroke();
    for (let x = x0 + 30; x < x1; x += 60) bulbSimple(c, x, yAt(x) - 8, 3, BULBS[(x / 60 | 0) % 5]);
    c.restore();
  }

  // Look constants. Sketch units become world units through the *_SC factors.
  const SC_P = 0.46;      // player's car
  const SC_C = 0.4;       // chasers' cars
  const HK = 0.64;        // hook (bigger than the sketch so it reads as a hook, not a lamp)
  const POLE_L = 135;     // pole + hook, in sketch units
  const CAR_CX = 65, CAR_CY = 17;                       // centre of the car body, from the body origin
  const CAR_LOW = [[-46, 64], [65, 68], [176, 64]];      // lowest points (rear, middle, front)
  const NOSE = 176 * SC_C;
  const SPR_PLAYER = { x0: -64, x1: 262, y0: -POLE_L - 8, y1: 154 };
  const SPR_CHASER = { x0: -64, x1: 200, y0: -POLE_L - 56, y1: 154 };
  const BG_F = 0.5;       // world units per sketch unit in the backdrops
  const D0 = { glow: false };
  const CHASERS = [
    { body: '#2f7bff', num: '12', accent: COL.yellow, driver: { ...D0, skin: '#e9b07a', hair: 'afro', hairCol: '#2a1a10', expr: 'angry', shades: false, arms: 'fist', shirt: '#ff8a1f' } },
