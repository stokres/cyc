  // ---------- world generation ----------
  function addSegment(ax, ay, bx, by) {
    segments.push({ ax, ay, bx, by, minX: Math.min(ax, bx), maxX: Math.max(ax, bx) });
  }
  // A cable (garland, ramp or the start line): physics segments plus the bulbs strung along it.
  function addCable(kind, pts) {
    const bulbs = [];
    let len = 0, next = 17;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      addSegment(a.x, a.y, b.x, b.y);
      while (len + segLen >= next) {
        const t = (next - len) / segLen;
        bulbs.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, c: bulbs.length % 5, ph: rand(0, 6.28) });
        next += 34;
      }
      len += segLen;
    }
    cables.push({ kind, pts, minX: pts[0].x, maxX: pts[pts.length - 1].x, bulbs });
  }
  // Pen strokes are the neon layer drawn by the player; segments are the physics layer.
  function newStroke() {
    const stroke = { pts: [], minX: Infinity, maxX: -Infinity, ph0: rand(0, 6), ph1: rand(0, 6), path: null, pathN: 0 };
    strokes.push(stroke);
    return stroke;
  }
  function pushStrokePoint(stroke, x, y) {
    stroke.pts.push({ x, y });
    stroke.minX = Math.min(stroke.minX, x);
    stroke.maxX = Math.max(stroke.maxX, x);
  }

  // 'garland': a string of bulbs hanging between two poles. 'ramp': a cable sloping down from a pole.
  function makeIsland(x0, w, type) {
    const amp = type === 'garland' ? rand(30, 120) : rand(50, 170);
    const base = rand(Math.max(260, amp + 90), 560);
    const steps = Math.max(4, Math.round(w / 18));
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const y = type === 'garland'
        ? base - amp + amp * Math.sin(Math.PI * u)
        : base - amp * (1 - u) + amp * 0.15 * Math.sin(Math.PI * u);
      pts.push({ x: x0 + u * w, y });
    }
    addCable(type, pts);
    decor.push({ type: 'pole', x: pts[0].x, y: pts[0].y });
    const last = pts[pts.length - 1];
    if (type === 'garland') decor.push({ type: 'pole', x: last.x, y: last.y });
    else decor.push({ type: 'lamp', x: last.x, y: last.y });
    // Early on, tokens sit right on the cables so hooking along them refills you.
    const climb = Math.min(1, x0 / C.PICKUP_RAMP_DIST);
    const hasIslandInk = rng() < 0.85 * (1 - climb);
    if (hasIslandInk) {
      const p = pts[Math.floor(rand(1, pts.length - 1))];
      pickups.push({ x: p.x, y: p.y - rand(14, 34) });
    }
  }

  function generate(untilX) {
    while (gen.x < untilX) {
      const difficulty = Math.min(1, gen.x / C.DIFFICULTY_DIST);
      gen.x += rand(100, 190 + 220 * difficulty);
      const w = rand(260, 640 - 220 * difficulty);
      makeIsland(gen.x, w, rng() < 0.55 ? 'garland' : 'ramp');
      gen.x += w;
    }
    while (gen.inkX < untilX) {
      const difficulty = Math.min(1, gen.inkX / C.DIFFICULTY_DIST);
      gen.inkX += rand(200, 380 + 220 * difficulty);
      // Biased toward the top: descending is free, cable makes you climb.
      const climb = Math.min(1, gen.inkX / C.PICKUP_RAMP_DIST);
      const lowY = 200 + 250 * rng();
      const highY = 55 + 300 * Math.pow(rng(), 1.5);
      pickups.push({ x: gen.inkX, y: lowY + (highY - lowY) * climb });
    }
  }

  // ---------- drawing input ----------
  function toWorld(p) {
    return { x: cam + p.x / scale, y: (p.y - offY) / scale };
  }

  function addPenPoint(world) {
    const wx = world.x;
    const wy = clamp(world.y, 0, C.FLOOR_Y - 12);
    const inRange = Math.hypot(wx - drop.x, wy - drop.y) <= C.DRAW_RADIUS;
    const outsideBlob = wx > blob.x + 20;
    const isOutOfInk = ink <= 0;
    if (inRange && outsideBlob && isOutOfInk) scratchDry(wx, wy);
    const canDraw = inRange && outsideBlob && !isOutOfInk;
    if (!canDraw) { pen.last = null; pen.stroke = null; return; }
    if (!pen.last) { pen.last = { x: wx, y: wy }; return; }
    let len = Math.hypot(wx - pen.last.x, wy - pen.last.y);
    if (len < C.MIN_POINT_DIST) return;
    let tx = wx, ty = wy;
    const cost = len * C.INK_PER_UNIT;
    if (cost > ink) {
      const frac = ink / cost;
      tx = pen.last.x + (wx - pen.last.x) * frac;
      ty = pen.last.y + (wy - pen.last.y) * frac;
      len *= frac;
    }
    if (!pen.stroke) {
      pen.stroke = newStroke();
      pushStrokePoint(pen.stroke, pen.last.x, pen.last.y);
    }
    pushStrokePoint(pen.stroke, tx, ty);
    addSegment(pen.last.x, pen.last.y, tx, ty);
    drawnThisFrame += len;
    ink = Math.max(0, ink - len * C.INK_PER_UNIT);
    blob.feed += len * C.FEED_PER_UNIT;
    pen.last = { x: tx, y: ty };
  }

  // Out of cable: loose little sparks where you try to draw, a dull zzt, and an "out of cable" alert.
  function scratchDry(wx, wy) {
    dryAlert = 1;
    const isSoundDue = animT - lastDrySound > 0.22;
    if (isSoundDue) { lastDrySound = animT; sound.dry(); }
    if (Math.random() < 0.5) emitSparks(wx, wy, 2, 90, -Math.PI / 2, 4);
  }

  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    canvas.setPointerCapture(e.pointerId);
    pointer = pointerPos(e);
    pen = { last: null, stroke: null };
    addPenPoint(toWorld(pointer));
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pen) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of events) {
      pointer = pointerPos(ce);
      addPenPoint(toWorld(pointer));
    }
  });
  const endPen = () => { pen = null; pointer = null; };
  canvas.addEventListener('pointerup', endPen);
  canvas.addEventListener('pointercancel', endPen);

  // ---------- simulation ----------
  // The hook rolls on top of the cables. It only catches a cable it comes down on: from below or from the side it goes through.
  function stepDrop(dt) {
    const d = drop, R = C.HOOK_R;
    const px = d.x, py = d.y;                  // where the hook was at the previous substep
    d.vy += C.GRAVITY * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.grounded = false;
    const lo = Math.min(px, d.x) - R, hi = Math.max(px, d.x) + R;
    for (const s of segments) {
      if (s.maxX < lo || s.minX > hi) continue;
      const ex = s.bx - s.ax, ey = s.by - s.ay;
      const len2 = ex * ex + ey * ey || 1;
      const len = Math.sqrt(len2);
      let sx = ey / len, sy = -ex / len;       // segment normal, flipped to point up
      if (sy > 0) { sx = -sx; sy = -sy; }
      if (sy > -0.2) continue;                 // (nearly) vertical cables can't be hooked
      const wasAbove = (px - s.ax) * sx + (py - s.ay) * sy >= 0;
      if (!wasAbove) continue;
      const t = clamp(((d.x - s.ax) * ex + (d.y - s.ay) * ey) / len2, 0, 1);
      let nx = d.x - (s.ax + ex * t), ny = d.y - (s.ay + ey * t);
      const dist = Math.hypot(nx, ny);
      const isTouching = dist < R && dist > 0;
      if (!isTouching) continue;
      nx /= dist; ny /= dist;
      const vn = d.vx * nx + d.vy * ny;
      if (vn >= 0) continue;                   // already moving away: leave it alone
      d.x += nx * (R - dist);
      d.y += ny * (R - dist);
      d.impact = Math.max(d.impact, -vn);
      d.vx -= (1 + C.BOUNCE) * vn * nx;
      d.vy -= (1 + C.BOUNCE) * vn * ny;
      if (ny < -0.35) { d.grounded = true; d.gnx = nx; d.gny = ny; }
    }
    if (d.grounded) {
      const tx = -d.gny, ty = d.gnx; // tangent pointing right
      const tangentSpeed = d.vx * tx + d.vy * ty;
      // Arcade slopes: downhill pulls harder, uphill brakes less, so speed carries over hills.
      const isDownhill = ty > 0;
      const slopeFactor = isDownhill ? C.DOWNHILL_GRAVITY : C.UPHILL_GRAVITY;
      const slopeBoost = C.GRAVITY * ty * (slopeFactor - 1) * dt;
      d.vx += tx * slopeBoost;
      d.vy += ty * slopeBoost;
      if (tangentSpeed < C.WALK_SPEED) {
        d.vx += tx * C.WALK_ACCEL * dt;
        d.vy += ty * C.WALK_ACCEL * dt;
      }
      d.vx *= 1 - C.FRICTION;
      d.vy *= 1 - C.FRICTION;
    }
    if (d.y - R < 0) { d.y = R; if (d.vy < 0) d.vy = -d.vy * 0.3; }
    const speed = Math.hypot(d.vx, d.vy);
    if (speed > C.MAX_SPEED) { d.vx *= C.MAX_SPEED / speed; d.vy *= C.MAX_SPEED / speed; }
  }

  // ---------- effects ----------
  // Loose sparks: dir/spread in radians, speed in units/s, optionally inheriting a velocity.
  function emitSparks(x, y, n, speed, dir, spread, vx0 = 0, vy0 = 0) {
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - 0.5) * spread, v = speed * (0.35 + Math.random() * 0.65);
      const life = 0.25 + Math.random() * 0.4;
      sparksFx.push({ x, y, vx: vx0 + Math.cos(a) * v, vy: vy0 + Math.sin(a) * v, life, max: life, k: (Math.random() * 3) | 0 });
    }
    if (sparksFx.length > 240) sparksFx.splice(0, sparksFx.length - 240);
  }
  function addBurst(x, y, big, sc) {
    if (!A) return;
    const list = big ? A.bigBursts : A.bursts;
    bursts.push({ x, y, age: 0, life: big ? 0.5 : 0.32, sp: list[(Math.random() * list.length) | 0], sc, rot: (Math.random() - 0.5) * 0.9 });
    if (bursts.length > 14) bursts.shift();
  }
  function addOno(key, x, y, sc, life) {
    onos.push({ key, x, y, age: 0, life: life || 0.9, rot: (Math.random() - 0.5) * 0.35, sc: sc || 1 });
    if (onos.length > 4) onos.shift();
  }

  function updateFx(dt) {
    for (const p of sparksFx) {
      p.vy += 900 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    sparksFx = sparksFx.filter((p) => p.life > 0);
    for (const b of bursts) b.age += dt;
    bursts = bursts.filter((b) => b.age < b.life);
    for (const o of onos) o.age += dt;
    onos = onos.filter((o) => o.age < o.life);
    for (const c of cuts) {
      c.age += dt;
      c.vy += 760 * dt;
      c.sparkT -= dt;
      for (let i = 0; i < c.pts.length; i++) {
        const p = c.pts[i];
        p.y += c.vy * dt * (1 + i * 0.16);
        p.x += (c.vx + Math.sin(c.age * 7 + i) * 14) * dt;
      }
      if (c.sparkT <= 0) { c.sparkT = 0.07; emitSparks(c.pts[0].x, c.pts[0].y, 2, 100, Math.PI / 2, 2.6); }
    }
    cuts = cuts.filter((c) => c.age < c.life);
  }

  // Cables the tide has just eaten fall away cut, throwing sparks.
  function spawnCut() {
    const hit = [];
    for (const s of segments) if (s.minX <= eatX && s.maxX > eatX) hit.push(s);
    if (!hit.length || cuts.length > 10) return;
    const s = hit[(Math.random() * hit.length) | 0];
    const ex = s.bx - s.ax, ey = s.by - s.ay, l = Math.hypot(ex, ey) || 1;
    const t = ex ? clamp((eatX - s.ax) / ex, 0, 1) : 0;
    const x = s.ax + ex * t, y = s.ay + ey * t;
    const pts = [];
    for (let i = 0; i < 6; i++) pts.push({ x: x - (ex / l) * i * 11, y: y - (ey / l) * i * 11 });
    cuts.push({ pts, vy: 0, vx: -10 - Math.random() * 25, age: 0, life: 1.1, sparkT: 0 });
    emitSparks(x, y, 7, 170, -Math.PI / 2, 3.4);
    if (x > cam - 60 && x < cam + viewW) addBurst(x, y, false, 0.5);
  }

  // Hook, pole and car: the car only hangs and swings, it never collides.
  function carPose() {
    const R = C.HOOK_R, t = drop.tilt;
    const px = drop.x - R * Math.sin(t), py = drop.y + R * Math.cos(t);   // where the hook touches the cable
    const rot = -car.phi * (reduceMotion ? 0.4 : 1), cr = Math.cos(rot), sr = Math.sin(rot);
    const lx = CAR_CX * SC_P, ly = (POLE_L + CAR_CY) * SC_P;
    car.px = px; car.py = py; car.rot = rot;
    car.x = px + lx * cr - ly * sr;
    car.y = py + lx * sr + ly * cr;
    let low = -1e9;
    for (const [bx, by] of CAR_LOW) low = Math.max(low, py + bx * SC_P * sr + (by + POLE_L) * SC_P * cr);
    car.low = low;
  }
  // A pendulum with a spring: leans back when the hook speeds up, forward when it brakes, and bounces.
  function updateCar(dt) {
    const c = car, k = Math.min(1, dt * 10);
    c.ax += (clamp((drop.vx - c.pvx) / dt, -2200, 2200) - c.ax) * k;
    c.ay += (clamp((drop.vy - c.pvy) / dt, -2600, 2600) - c.ay) * k;
    c.pvx = drop.vx; c.pvy = drop.vy;
    const g = clamp(C.GRAVITY - c.ay, 500, 2200);
    const acc = (-g * Math.sin(c.phi) - c.ax * Math.cos(c.phi)) / C.PEND_L - C.PEND_K * c.phi - C.PEND_D * c.phiV;
    c.phiV += acc * dt;
    c.phi += c.phiV * dt;
    const lim = 1.2;
    if (Math.abs(c.phi) > lim) { c.phi = Math.sign(c.phi) * lim; c.phiV *= -0.45; }
    carPose();
  }

  let rehooked = false;
  function updatePower(dt) {
    rehooked = false;
    if (drop.grounded) {
      if (airTime > C.REHOOK_AIR) {
        rehooked = true;
        sound.reenganche();
        addBurst(car.px, car.py - 6, true, 0.75);
        addOno('zas', car.px + 10, car.py - 56, 1, 0.8);
        emitSparks(car.px, car.py, 22, 320, -Math.PI / 2, 4.6, drop.vx * 0.3, 0);
        if (!reduceMotion) shake = Math.max(shake, 5);
        if (fer.luz) pedirRotulo('vuelve', { fuerza: true });
      }
      fer.luz = false;
      airTime = 0;
      power = 1;
    } else {
      airTime += dt;
      power = Math.max(0, power - dt / C.POWER_FADE);
    }
    sound.power(power);
    // Sparks at the contact while the current flows.
    if (drop.grounded && power > 0.5) {
      const sp = Math.hypot(drop.vx, drop.vy);
      sparkAcc += dt * (9 + sp * 0.03);
      while (sparkAcc >= 1) {
        sparkAcc -= 1;
        emitSparks(car.px, car.py - 1, 1, 150, -Math.PI / 2 + drop.tilt * 0.5, 2.8, drop.vx * 0.35, drop.vy * 0.2);
      }
      chispaT -= dt;
      if (chispaT <= 0) {
        chispaT = 0.5 + Math.random() * 0.9;
        emitSparks(car.px, car.py - 2, 7, 230, -Math.PI / 2, 3.2, drop.vx * 0.3, 0);
        sound.chispa();
      }
    }
  }

  // Landings: a hard one gives sparks and a little shake. (A zap after a long fall is handled by updatePower.)
  function updateImpact() {
    const d = drop;
    const isLanding = d.impact > 220 && !rehooked;
    if (isLanding) {
      const p = Math.min(1, d.impact / 700);
      sound.splat(p);
      if (!reduceMotion) shake = Math.max(shake, p * 5);
      emitSparks(car.px, car.py, Math.round(4 + p * 8), 120 + p * 160, -Math.PI / 2, 3.4);
    }
    d.impact = 0;
  }

  // ---------- the tide of bumper cars ----------
  function blobHalf() {
    return C.BLOB_HALF + Math.min(30, blob.feed * 0.6) * 1.5;
  }
  // How far the band's front recedes at height y: 0 at its center, BLOB_ROUND at its top/bottom edge.
  function blobRecede(y) {
    const u = (y - blob.cy) / blobHalf();
    const inside = 1 - u * u;
    return inside > 0 ? (1 - Math.sqrt(inside)) * C.BLOB_ROUND : C.BLOB_ROUND;
  }
  function blobFront(y, t) {
    const k = reduceMotion ? 0.3 : 1;
    const hunger = Math.min(30, blob.feed * 0.6);
    let x = (18 + hunger) * Math.sin(y * 0.021 + t * 1.3 * k)
      + 11 * Math.sin(y * 0.057 - t * 2.1 * k)
      + 6 * Math.sin(y * 0.13 + t * 3.7 * k);
    const half = blobHalf();
    for (const td of tendrils) {
      const reach = Math.max(0, 1 - Math.abs(y - (blob.cy + td.u * half)) / 12);
      x += reach * td.len * (0.55 + 0.45 * Math.sin(t * 2 * k + td.phase));
    }
    return blob.x + x - blobRecede(y);
  }
  function isInBand(y) {
    return Math.abs(y - blob.cy) < blobHalf();
  }

  // Where every chaser is this frame (pole x, hook y, tilt).
  function layoutTide(t) {
    const half = blobHalf(), k = reduceMotion ? 0.3 : 1;
    for (const c of blob.cars) {
      const yRow = blob.cy + c.u * half * 0.82 + Math.sin(t * 6 + c.ph) * 1.5 * k;
      c.px = blobFront(yRow, t) - NOSE - c.d + Math.sin(t * 4.3 + c.ph * 1.3) * 3 * k;
      c.py = yRow - (POLE_L + CAR_CY) * SC_C + Math.sin(t * 8 + c.ph) * 1.2 * k;
      c.rot = Math.sin(t * 2.6 + c.ph) * 0.05 * k + c.kick;
    }
  }

  function updateTide(dt) {
    blob.cy += (clamp(car.y, 235, 515) - blob.cy) * Math.min(1, dt * C.BLOB_TRACK_Y);
    for (const c of blob.cars) {
      c.kick += c.kickV * dt;
      c.kickV += (-70 * c.kick - 7 * c.kickV) * dt;
    }
    const onScreen = (x) => x > cam - 80 && x < cam + viewW + 40;
    // They bump into each other: sparks, kicks and the odd MEC MEC.
    blob.bumpT -= dt;
    if (blob.bumpT <= 0) {
      blob.bumpT = 0.3 + Math.random() * 0.6;
      const a = blob.cars[(Math.random() * blob.cars.length) | 0];
      let b = null, bd = 1e9;
      for (const o of blob.cars) {
        if (o === a) continue;
        const dd = Math.hypot(o.px - a.px, o.py - a.py);
        if (dd < bd) { bd = dd; b = o; }
      }
      a.kickV += (Math.random() < 0.5 ? -1 : 1) * 3;
      if (b) b.kickV += (Math.random() < 0.5 ? -1 : 1) * 3;
      const mx = (a.px + (b ? b.px : a.px)) / 2 + 26, my = (a.py + (b ? b.py : a.py)) / 2 + 40;
      if (onScreen(mx)) {
        addBurst(mx, my, false, 0.5);
        emitSparks(mx, my, 5, 140, -Math.PI / 2, 5);
        const r = Math.random();
        if (r < 0.16) addOno('pam', mx, my - 22, 0.8, 0.8);
        else if (r < 0.46) addOno(r < 0.3 ? 'mec' : 'mecmec', mx, my - 44, 1, 0.9);
      }
    }
    // The cable stubs they ride on are cut at the back: sparks.
    for (const c of blob.cars) {
      if (!onScreen(c.px - 120)) continue;
      if (Math.random() < dt * 5) emitSparks(c.px - 128, c.py + 6, 2, 110, -Math.PI / 2, 3);
    }
    // Horns when they are close.
    bocinaT -= dt;
    if (bocinaT <= 0) {
      bocinaT = 1.4 + Math.random() * 2.2;
      if (danger > 0.25) sound.bocina();
    }
  }

  function update(dt) {
    time += dt;
    const sub = dt / C.SUBSTEPS;
    for (let i = 0; i < C.SUBSTEPS; i++) stepDrop(sub);
    const surfaceAngle = drop.grounded ? Math.atan2(drop.gnx, -drop.gny) : 0;
    drop.tilt += (surfaceAngle - drop.tilt) * Math.min(1, dt * 10);
    updatePower(dt);
    updateImpact();
    updateCar(dt);

    const target = drop.x - viewW * C.CAM_ANCHOR;
    cam += (target - cam) * Math.min(1, dt * 4);
    if (followY) {
      camY += (camYTarget() - camY) * Math.min(1, dt * C.CAM_Y_FOLLOW);
      camY = Math.max(camY, Math.min(camYMax, car.low + 70 - viewH));   // the whole car always stays in view
      applyCamY();
    }

    // Holding still keeps drawing as the world scrolls under the pen.
    if (pen && pointer) addPenPoint(toWorld(pointer));
    sound.zumbido(clamp(drawnThisFrame / dt / 900, 0, 1));
    drawnThisFrame = 0;

    // The tide matches the hook's sustained pace, so going fast only buys distance while you keep it up.
    blob.pace += (Math.max(0, drop.vx) - blob.pace) * Math.min(1, dt * C.BLOB_PACE_SMOOTHING);
    const baseSpeed = Math.min(C.BLOB_SPEED_MAX, C.BLOB_SPEED_START + C.BLOB_SPEED_GAIN * time);
    const blobSpeed = Math.max(baseSpeed, blob.pace * C.BLOB_SPEED_RATIO);
    const lunge = blob.feed * Math.min(1, dt * C.FEED_EASE);
    blob.feed -= lunge;
    blob.x = Math.max(blob.x + blobSpeed * dt + lunge, cam - C.BLOB_LEASH);
    const isFeeding = lunge > 0.5;
    if (isFeeding && Math.random() < 0.5) {
      const y = blob.cy + (Math.random() * 2 - 1) * blobHalf();
      emitSparks(blobFront(y, animT) + 10, y, 2, 160, -0.3, 1.8, 0, 0);
    }
    updateTide(dt);

    for (const p of pickups) {
      const nearHook = Math.hypot(p.x - drop.x, p.y - drop.y) < C.DROP_R + 12;
      const nearCar = Math.hypot(p.x - car.x, p.y - car.y) < 34;
      if (nearHook || nearCar) {
        p.taken = true;
        emitSparks(p.x, p.y, 10, 180, -Math.PI / 2, 6.28);
        sound.ficha();
        pedirRotulo('ficha');
        flyers.push({ sx: (p.x - cam) * scale, sy: p.y * scale + offY, age: 0 });
      }
    }
    for (const f of flyers) {
      f.age += dt;
      if (f.age >= C.PICKUP_FLY_TIME) {
        f.done = true;
        ink = Math.min(C.INK_MAX, ink + C.INK_PICKUP);
        barPulse = 1;
      }
    }
    flyers = flyers.filter((f) => !f.done);
    barPulse = Math.max(0, barPulse - dt * 4);
    dryAlert = Math.max(0, dryAlert - dt * 1.5);

    // The tide eats everything behind its rearmost front point; what it eats falls away cut.
    eatX = blob.x - C.BLOB_ROUND - 40;
    segments = segments.filter((s) => s.maxX > eatX);
    strokes = strokes.filter((s) => s.maxX > eatX || s === pen?.stroke);
    cables = cables.filter((c) => c.maxX > eatX);
    decor = decor.filter((d) => d.x > eatX - 120);
    pickups = pickups.filter((p) => !p.taken && p.x > eatX);
    cutT -= dt;
    if (cutT <= 0) { cutT = 0.22 + Math.random() * 0.25; spawnCut(); }
    generate(cam + viewW + 800);

    distance = Math.max(distance, drop.x / C.UNITS_PER_METER);
    updateFx(dt);
    updateFeriante(dt);

    // Caught: the tide reaches the middle of the car (not the hook).
    const front = blobFront(car.y, animT);
    const inBand = isInBand(car.y);
    const gap = car.x - front;
    danger = inBand ? clamp(1 - gap / 260, 0, 1) : clamp(1 - gap / 260, 0, 1) * 0.4;
    dangerS += (danger - dangerS) * Math.min(1, dt * 1.2);
    sound.intensity(dangerS);
    shake *= Math.exp(-dt * 10);

    if (inBand && gap < C.CATCH_GAP) die('caught');
    else if (car.low >= C.FLOOR_Y) die('fell');
  }

  function updateDead(dt) {
    blob.x += 140 * dt;
    updateTide(dt);
    updateCar(dt);
    shake *= Math.exp(-dt * 8);
    updateFx(dt);
    tickRotulo(dt);
  }

  function die(reason) {
    state = 'dead';
    pen = null;
    sound.zumbido(0);
    if (!reduceMotion) shake = 12;
    sound.cerrarMusica();
    if (reason === 'caught') {
      sound.topetazo();
      drop.alive = false;
      addBurst(car.x, car.y, true, 1);
      addOno('pam', car.x, car.y - 36, 1.3, 1.2);
      emitSparks(car.x, car.y, 30, 320, -Math.PI / 2, 6.28);
    } else {
      sound.death();
      addBurst(car.x, car.low - 6, true, 0.8);
      addOno('aaah', car.x, car.y - 70, 1.1, 1.2);
      emitSparks(car.x, car.low, 20, 260, -Math.PI / 2, 4);
    }
    const meters = Math.floor(distance);
    const previousBest = best;
    const rankIndex = addRun(meters);
    const isRecord = rankIndex === 0 && meters > previousBest;
    setTimeout(() => { if (state === 'dead') showOverlay(reason, meters, isRecord, rankIndex); }, 850);
  }

  // ---------- rendering ----------
  // Backdrops are pre-rendered strips: per frame it is only drawImage, plus a few bulbs that twinkle.
  function drawStrip(layer, par, baseY) {
    const f = BG_F * scale, w = layer.tw * f;
    const top = baseY + layer.b.y0 * f, h = (layer.b.y1 - layer.b.y0) * f;
    if (top > cssH) return;
    const x0 = -((((cam * par * scale) % w) + w) % w);
    for (let x = x0; x < cssW; x += w) ctx.drawImage(layer.sp.cv, x, top, w + 1, h);
    const bottom = top + h;
    if (bottom < cssH) { ctx.fillStyle = '#0a0420'; ctx.fillRect(0, bottom - 1, cssW, cssH - bottom + 1); }
    return { x0, w, f };
  }

  function drawBackdrop(t) {
    ctx.drawImage(A.sky, 0, 0, cssW, cssH);
    const fl = (C.FLOOR_Y - camY) * scale;            // where the floor really is on the screen
    const flMin = (C.FLOOR_Y - camYMax) * scale;      // ... with the camera at its lowest
    drawStrip(A.far, 0.18, flMin + (fl - flMin) * 0.3);
    const baseY = flMin + (fl - flMin) * 0.62;
    const m = drawStrip(A.mid, 0.45, baseY);
    if (m && !reduceMotion) {
      // A few bulbs that twinkle on the stalls.
      for (let x = m.x0; x < cssW; x += m.w) {
        for (const l of A.mid.lights) {
          const tw = 0.45 + 0.45 * Math.sin(t * 2.6 + l.ph) * Math.sin(t * 1.3 + l.ph * 2);
          ctx.globalAlpha = Math.max(0, tw);
          const sp = A.bulbs[l.c], g = 1.1 * scale / sp.k;
          ctx.drawImage(sp.cv, x + l.x * m.f - sp.px * g, baseY + l.y * m.f - sp.py * g, sp.cv.width * g, sp.cv.height * g);
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawCrowd() {
    const f = BG_F, near = A.near, tw = near.tw * f;
    const top = C.FLOOR_Y + near.b.y0 * f, h = (near.b.y1 - near.b.y0) * f;
    if (top > visBottom) return;
    for (let x = Math.floor((cam - 20) / tw) * tw; x < cam + viewW + 20; x += tw) ctx.drawImage(near.sp.cv, x, top, tw + 0.5, h);
  }

  // The fairground floor: the line the car must not touch.
  function drawFloor() {
    if (visBottom < C.FLOOR_Y - 12) return;
    const x = cam - 60, w = viewW + 120, h = visBottom - C.FLOOR_Y + 80;
    ctx.fillStyle = '#0b0522';
    ctx.fillRect(x, C.FLOOR_Y, w, h);
    ctx.fillStyle = '#1a0b46';
    ctx.fillRect(x, C.FLOOR_Y, w, 5);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, C.FLOOR_Y + 0.5); ctx.lineTo(x + w, C.FLOOR_Y + 0.5);
    ctx.strokeStyle = 'rgba(255,61,168,0.25)'; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,120,200,0.95)'; ctx.lineWidth = 2.2; ctx.stroke();
    const step = 96, first = Math.floor((cam - 60) / step) * step;
    for (let bx = first, i = 0; bx < cam + viewW + 60; bx += step, i++) blitFlat(A.bulbs[(Math.floor(bx / step) % 5 + 5) % 5], bx, C.FLOOR_Y + 14, 0.55);
  }

  function drawPoles() {
    const left = cam - 60, right = cam + viewW + 60;
    ctx.lineJoin = 'round';
    for (const d of decor) {
      if (d.x < left || d.x > right) continue;
      if (d.type === 'pole') {
        const w = d.big ? 20 : 11, top = d.y, bot = C.FLOOR_Y + 40;
        ctx.beginPath();
        ctx.moveTo(d.x - w / 2, bot); ctx.lineTo(d.x - w * 0.38, top); ctx.lineTo(d.x + w * 0.38, top); ctx.lineTo(d.x + w / 2, bot);
        ctx.closePath();
        ctx.fillStyle = '#2b1858'; ctx.fill();
        ctx.lineWidth = 2.6; ctx.strokeStyle = OUT; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(d.x - w * 0.3, top + 4, w * 0.16, bot - top - 4);
        ctx.fillStyle = '#3d2278';
        ctx.fillRect(d.x - w * 1.1, top - 3, w * 2.2, 7);
        blitFlat(A.bulbs[1], d.x, top - 12, d.big ? 1.3 : 0.85);
      } else if (d.type === 'lamp') {
        blitFlat(A.bulbs[(Math.floor(d.x / 100) % 5 + 5) % 5], d.x, d.y + 8, 1);
      }
    }
  }

  function strokePath(s) {
    if (s.path && s.pathN === s.pts.length) return s.path;
    const p = s.pts, n = p.length, q = [];
    for (let i = 0; i < n; i++) {
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let dx = b.x - a.x, dy = b.y - a.y;
      const l = Math.hypot(dx, dy) || 1;
      dx /= l; dy /= l;
      const o = (Math.sin(i * 0.9 + s.ph0) * 0.6 + Math.sin(i * 2.3 + s.ph1) * 0.4) * 1.3;   // hand-drawn tremble
      q.push(p[i].x - dy * o, p[i].y + dx * o);
    }
    const path = new Path2D();
    path.moveTo(q[0], q[1]);
    for (let i = 1; i < n - 1; i++) path.quadraticCurveTo(q[i * 2], q[i * 2 + 1], (q[i * 2] + q[i * 2 + 2]) / 2, (q[i * 2 + 1] + q[i * 2 + 3]) / 2);
    path.lineTo(q[n * 2 - 2], q[n * 2 - 1]);
    s.path = path; s.pathN = n;
    return path;
  }

  function drawCables(t) {
    const left = cam - 40, right = cam + viewW + 40;
    ctx.save();
    ctx.beginPath(); ctx.rect(eatX, -200, right + 400 - eatX, C.WORLD_H + 600); ctx.clip();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // Wires of the garlands and ramps.
    const vis = cables.filter((c) => c.maxX >= left && c.minX <= right);
    ctx.beginPath();
    for (const c of vis) { ctx.moveTo(c.pts[0].x, c.pts[0].y); for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i].x, c.pts[i].y); }
    ctx.strokeStyle = '#08030f'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = 'rgba(150,120,220,0.55)'; ctx.lineWidth = 1.2; ctx.translate(0, -0.8); ctx.stroke(); ctx.translate(0, 0.8);
    for (const c of vis) {
      for (const b of c.bulbs) {
        if (b.x < left || b.x > right) continue;
        ctx.globalAlpha = reduceMotion ? 1 : 0.82 + 0.18 * Math.sin(t * 3 + b.ph);
        blitFlat(A.bulbs[b.c], b.x, b.y + 8, 0.8);
      }
    }
    ctx.globalAlpha = 1;
    // The player's own neon cable: a wide translucent stroke plus thin bright ones (no shadowBlur).
    const mine = strokes.filter((s) => s.pts.length > 1 && s.maxX >= left && s.minX <= right);
    for (const [col, w] of [['rgba(47,243,255,0.30)', 13], ['rgba(47,243,255,0.9)', 6]]) {
      ctx.strokeStyle = col; ctx.lineWidth = w;
      for (const s of mine) ctx.stroke(strokePath(s));
    }
    ctx.strokeStyle = COL.yellow; ctx.lineWidth = 3.2;
    for (const s of mine) ctx.stroke(strokePath(s));
    ctx.strokeStyle = '#fff7c2'; ctx.lineWidth = 1.2;
    for (const s of mine) ctx.stroke(strokePath(s));
    ctx.restore();
  }

  function drawPickups(t) {
    const isLow = state === 'play' && ink < C.LOW_INK;
    const left = cam - 30, right = cam + viewW + 30;
    for (const p of pickups) {
      if (p.x < left || p.x > right) continue;
      const bob = reduceMotion ? 0 : Math.sin(t * 3 + p.x * 0.01) * 3;
      const spin = reduceMotion ? 1 : Math.max(0.28, Math.abs(Math.cos(t * 2.2 + p.x * 0.013)));
      if (isLow) {
        ctx.strokeStyle = 'rgba(47,243,255,0.85)'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(p.x, p.y + bob, 18 + Math.sin(t * 6) * 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.scale(spin, 1);
      blitFlat(A.ficha, 0, 0, 13 / 28);
      ctx.restore();
    }
  }

  // Reach circle, centred on the hook.
  function drawRing() {
    const r = A.ring, s = r.size / scale;
    ctx.globalAlpha = ink <= 0 ? 0.25 : (pen ? 1 : 0.65);
    ctx.drawImage(r.cv, drop.x - s / 2, drop.y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  function drawPlayer(t) {
    if (!drop.alive) return;
    if (power < 0.995) blit(A.playerOff, car.px, car.py, car.rot, SC_P);
    if (power > 0.01) blit(A.playerLit, car.px, car.py, car.rot, SC_P, power);
    blit(A.hook, car.px, car.py, drop.tilt, HK);
    if (drop.grounded && power > 0.5) {
      const flick = reduceMotion ? 1 : 0.75 + 0.5 * Math.abs(Math.sin(t * 47));
      ctx.globalAlpha = Math.min(1, power);
      blit(A.flash, car.px, car.py - 2, 0, 0.55 * flick);
      ctx.globalAlpha = 1;
    }
  }

  // The tide: a pile of bumper cars, each hanging from its own piece of cable.
  function drawTide() {
    const vis = blob.order.filter((c) => c.px < cam + viewW + 160 && c.px > cam - 380);
    if (!vis.length) return;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const c of vis) { ctx.moveTo(c.px - 132, c.py + 7); ctx.quadraticCurveTo(c.px - 30, c.py - 1, c.px + 40, c.py + 3); }
    ctx.strokeStyle = 'rgba(47,243,255,0.26)'; ctx.lineWidth = 11; ctx.stroke();
    ctx.strokeStyle = 'rgba(47,243,255,0.85)'; ctx.lineWidth = 5; ctx.stroke();
    ctx.strokeStyle = COL.yellow; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.strokeStyle = '#fff7c2'; ctx.lineWidth = 1; ctx.stroke();
    for (const c of vis) blit(A.chasers[c.sp], c.px, c.py, c.rot, SC_C);
  }

  const SPARK_COL = ['#ffe83a', '#ffffff', '#2ff3ff'];
  function drawFx() {
    ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      let any = false;
      for (const p of sparksFx) {
        if (p.k !== k) continue;
        any = true;
        const l = 0.012 + 0.03 * (p.life / p.max);
        ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * l, p.y - p.vy * l);
      }
      if (!any) continue;
      ctx.strokeStyle = SPARK_COL[k]; ctx.globalAlpha = 0.25; ctx.lineWidth = 4.5; ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = k === 1 ? 1.1 : 1.7; ctx.stroke();
    }
    for (const c of cuts) {
      ctx.globalAlpha = Math.min(1, (c.life - c.age) / 0.3);
      ctx.beginPath(); ctx.moveTo(c.pts[0].x, c.pts[0].y);
      for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i].x, c.pts[i].y);
      ctx.strokeStyle = OUT; ctx.lineWidth = 5; ctx.stroke();
      ctx.strokeStyle = '#7d6aa8'; ctx.lineWidth = 2.8; ctx.stroke();
      ctx.strokeStyle = '#b9a6e6'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const b of bursts) {
      const u = b.age / b.life;
      ctx.globalAlpha = 1 - u * u;
      blit(b.sp, b.x, b.y, b.rot, b.sc * (0.7 + 0.5 * u));
    }
    ctx.globalAlpha = 1;
    for (const o of onos) {
      const u = o.age / o.life;
      const pop = u < 0.18 ? 0.4 + 0.75 * (u / 0.18) : 1.15 - 0.15 * Math.min(1, (u - 0.18) / 0.2);
      ctx.globalAlpha = u > 0.75 ? 1 - (u - 0.75) / 0.25 : 1;
      blit(A.onos[o.key], o.x, o.y - u * 14, o.rot, ONO_SC * o.sc * pop);
    }
    ctx.globalAlpha = 1;
  }

  function drawDanger() {
    if (danger <= 0) return;
    ctx.globalAlpha = danger * 0.5;
    ctx.drawImage(A.hud.danger, 0, 0, A.hud.dangerW, cssH);
    ctx.globalAlpha = 1;
  }

  function drawHud(t) {
    const h = A.hud;
    const isEmpty = ink <= 0, isLow = ink < C.LOW_INK;
    const jitter = dryAlert > 0 && !reduceMotion ? Math.sin(t * 50) * 4 * dryAlert : 0;
    ctx.drawImage(h.frame, jitter, 0, h.frameW, h.frameH);
    const fill = h.fw * (ink / C.INK_MAX);
    if (fill > 0.5) {
      const grow = barPulse * 5;
      ctx.drawImage(h.fill, 0, 0, Math.max(1, fill * dpr), h.fh * dpr, h.fx + jitter, h.fy - grow / 2, fill, h.fh + grow);
    }
    const ly = h.fy + h.fh + 13;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    if (isEmpty) {
      ctx.font = `15px ${F_TITLE}`;
      ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 5));
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = OUT; ctx.strokeText(L.sinFicha, h.fx + jitter, ly);
      ctx.fillStyle = COL.pink; ctx.fillText(L.sinFicha, h.fx + jitter, ly);
      ctx.globalAlpha = 1;
    } else {
      ctx.font = `${isLow ? 15 : 13}px ${isLow ? F_TITLE : F_ONO}`;
      ctx.fillStyle = isLow ? COL.yellow : '#c9b8ff';
      ctx.fillText(isLow ? L.pocoCable : L.cable.toUpperCase(), h.fx + jitter, ly);
    }
    // Right next to the pen, so the reason the line stopped is where you're looking.
    if (dryAlert > 0 && pointer) {
      ctx.globalAlpha = Math.min(1, dryAlert * 1.5);
      ctx.font = `20px ${F_TITLE}`; ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = OUT; ctx.strokeText(L.sinFicha, pointer.x, pointer.y - 44);
      ctx.fillStyle = '#ffffff'; ctx.fillText(L.sinFicha, pointer.x, pointer.y - 44);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
    updateHudNum(h, Math.floor(distance));
    ctx.drawImage(h.num, cssW - h.numW - 10, 4, h.numW, h.numH);
  }

  function drawFlyers() {
    const h = A.hud;
    const barX = h.fx + h.fw * (ink / C.INK_MAX), barY = h.fy + h.fh / 2;
    for (const f of flyers) {
      const u = f.age / C.PICKUP_FLY_TIME;
      const ease = u * u * (3 - 2 * u);
      const x = f.sx + (barX - f.sx) * ease;
      const y = f.sy + (barY - f.sy) * ease - Math.sin(u * Math.PI) * 60;
      const s = 62 * (1 - u * 0.45);
      ctx.drawImage(A.ficha.cv, x - s / 2, y - s / 2, s, s);
    }
  }

  // A small ring under the finger so you can see where the pen is.
  function drawPenTip() {
    if (!pointer || state !== 'play') return;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 14, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  }

  // ---------- the fairground man (feriante) ----------
  // A fairground sign with bulbs, tilted, that pops up for ~1.8 s with a phrase when something happens. Each phrase is drawn once on its own off-screen
  // canvas; per frame it is a single drawImage. Signs are spaced at least FER_GAP seconds apart, except the forced ones (the current going away and coming back).
  const FER_LIFE = 1.8, FER_GAP = 6, FER_MARGIN = 12;
  const rotulos = new Map();                  // phrase → { cv, w, h } (css pixels); emptied when the images are rebuilt
  let letrero = null;                         // the sign on screen: { sp, age (negative = still waiting), tilt }
  let fer = null;                             // what the feriante remembers of this run
  function resetFeriante() {
    letrero = null;
    fer = { desde: FER_GAP, ultimas: {}, luz: false, sin: false, rapido: 0, cerca: 0, hito: 1 };
  }

  function rotuloSprite(texto) {
    const hit = rotulos.get(texto);
    if (hit) return hit;
    const d = dpr, maxW = Math.min(cssW * 0.46, 360);
    let fs = clamp(Math.round(cssH * 0.06), 17, 28);
    const meas = makeCanvas(8, 8).getContext('2d');
    let lines;
    for (;;) {
      meas.font = `${fs}px ${F_TITLE}`;
      const avail = maxW - fs * 1.8, words = texto.split(' ');
      lines = [texto];
      let widest = meas.measureText(texto).width;
      if (widest > avail) {
        // Two balanced lines: the split that leaves the shorter longest line.
        let best = Infinity;
        for (let i = 1; i < words.length; i++) {
          const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
          const wide = Math.max(meas.measureText(a).width, meas.measureText(b).width);
          if (wide < best) { best = wide; lines = [a, b]; }
        }
        widest = best;
      }
      if (widest <= avail || fs <= 13) break;
      fs -= 1;
    }
    const textW = Math.max(...lines.map((l) => meas.measureText(l).width));
    const padX = fs * 0.9, padY = fs * 0.5, lh = fs * 1.12;
    const w = Math.ceil(textW + padX * 2), h = Math.ceil(lines.length * lh + padY * 2), m = 12;
    const cv = makeCanvas((w + m * 2) * d, (h + m * 2) * d);
    const c = cv.getContext('2d');
    c.scale(d, d);
    c.translate(m, m);
    // The board: red with diagonal stripes, dark edge, light inner line.
    rr(c, 0, 0, w, h, 10);
    c.fillStyle = '#d9283f'; c.fill();
    c.save(); c.clip();
    c.fillStyle = '#ea4a5e';
    for (let x = -h; x < w + h; x += 30) { c.beginPath(); c.moveTo(x, h); c.lineTo(x + 15, h); c.lineTo(x + 15 + h * 0.5, 0); c.lineTo(x + h * 0.5, 0); c.closePath(); c.fill(); }
    c.restore();
    rr(c, 3, 3, w - 6, h - 6, 8); c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,255,255,0.35)'; c.stroke();
    rr(c, 0, 0, w, h, 10); c.lineWidth = 4; c.strokeStyle = OUT; c.lineJoin = 'round'; c.stroke();
    // The bulbs along the edge.
    const step = 15;
    const nx = Math.max(2, Math.round(w / step)), ny = Math.max(1, Math.round(h / step));
    let k = 0;
    for (let i = 0; i <= nx; i++) bulb(c, (w * i) / nx, 0, 3.2, BULBS[k++ % 5], true, 3.2);
    for (let i = 1; i <= ny; i++) bulb(c, w, (h * i) / ny, 3.2, BULBS[k++ % 5], true, 3.2);
    for (let i = nx - 1; i >= 0; i--) bulb(c, (w * i) / nx, h, 3.2, BULBS[k++ % 5], true, 3.2);
    for (let i = ny - 1; i >= 1; i--) bulb(c, 0, (h * i) / ny, 3.2, BULBS[k++ % 5], true, 3.2);
    // The phrase.
    lines.forEach((line, i) => txt(c, line, w / 2, padY + lh * (i + 0.5) + 1, { size: fs, fill: COL.yellow, lw: fs * 0.26, ext: 2, extCol: '#7a0f4a' }));
    const sp = { cv, w, h, m };
    rotulos.set(texto, sp);
    return sp;
  }

  // Shows a sign for the situation `grupo` (keys of L.feriante) unless one was shown less than FER_GAP seconds ago. `fuerza` skips that rest; `texto` is a given phrase.
  function pedirRotulo(grupo, { fuerza = false, retraso = 0, texto = null } = {}) {
    if (!fuerza && fer.desde < FER_GAP) return false;
    let frase = texto;
    if (!frase) {
      const lista = L.feriante[grupo].filter((f) => f !== fer.ultimas[grupo]);
      frase = lista[(Math.random() * lista.length) | 0];
      fer.ultimas[grupo] = frase;
    }
    letrero = { sp: rotuloSprite(frase), age: -retraso, tilt: (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.03) };
    fer.desde = 0;
    return true;
  }

  function tickRotulo(dt) {
    if (!letrero) return;
    letrero.age += dt;
    if (letrero.age > FER_LIFE) letrero = null;
  }

  function updateFeriante(dt) {
    fer.desde += dt;
    tickRotulo(dt);
    const sp = Math.hypot(drop.vx, drop.vy);
    fer.rapido = drop.grounded && drop.vy > 100 && sp > 540 ? fer.rapido + dt : 0;
    fer.cerca = danger > 0.7 ? fer.cerca + dt : 0;
    if (ink > 1) fer.sin = false;
    // The current going away: it is the one the other signs give way to (and «vuelve» answers it, see updatePower).
    if (!drop.grounded && airTime > 0.5 && !fer.luz) { fer.luz = true; pedirRotulo('luz', { fuerza: true }); return; }
    // Every 100 m, a phrase for the stretch; if another sign was too recent it waits its turn.
    const tramo = Math.floor(distance / 100);
    if (tramo >= fer.hito) {
      const frases = L.feriante.hitos;
      const texto = tramo <= frases.length ? frases[tramo - 1] : L.feriante.hito.replace('{n}', tramo * 100);
      if (pedirRotulo('hitos', { texto })) { fer.hito = tramo + 1; return; }
    }
    if (ink <= 0 && !fer.sin && pedirRotulo('sinFicha')) { fer.sin = true; return; }
    if (fer.cerca > 0.3 && pedirRotulo('cerca')) { fer.cerca = 0; return; }
    if (fer.rapido > 0.4 && pedirRotulo('rapido')) fer.rapido = 0;
  }

  function drawFeriante() {
    const s = letrero;
    if (!s || s.age < 0) return;
    const sp = s.sp, u = s.age / FER_LIFE, d = dpr;
    // Pops in with a little overshoot, then holds and fades out.
    const pop = u < 0.12 ? 0.4 + 0.75 * (u / 0.12) : u < 0.22 ? 1.15 - 0.15 * ((u - 0.12) / 0.1) : 1;
    const wob = reduceMotion ? 0 : Math.sin(s.age * 9) * 0.012 * Math.max(0, 1 - u * 1.6);
    ctx.globalAlpha = u > 0.82 ? 1 - (u - 0.82) / 0.18 : 1;
    // Top right, under the metres, so it never covers the middle of the screen.
    const cx = cssW - 14 - (sp.w + sp.m) / 2, cy = 82 + (sp.h + sp.m) / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s.tilt + wob);
    ctx.scale(pop, pop);
    ctx.drawImage(sp.cv, -sp.cv.width / d / 2, -sp.cv.height / d / 2, sp.cv.width / d, sp.cv.height / d);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function render(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!A) { ctx.fillStyle = '#0b0526'; ctx.fillRect(0, 0, cssW, cssH); return; }
    drawBackdrop(t);
    layoutTide(t);

    const shakeX = shake > 0.1 ? (Math.random() - 0.5) * shake : 0;
    const shakeY = shake > 0.1 ? (Math.random() - 0.5) * shake : 0;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (-cam * scale + shakeX) * dpr, (offY + shakeY) * dpr);
    drawCrowd();
    drawFloor();
    drawPoles();
    drawCables(t);
    drawPickups(t);
    if (state === 'play') drawRing();
    drawPlayer(t);
    drawTide();
    drawFx();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'play') drawDanger();
    if (state !== 'title') { drawHud(t); drawFlyers(); drawFeriante(); }
    drawPenTip();
    if (perf.visible) drawPerf();
  }

  function drawPerf() {
    const lines = [
      `${perf.fps.toFixed(0)} fps  worst ${perf.worst.toFixed(1)} ms`,
      `update ${perf.avgUpdate.toFixed(2)} ms  render ${perf.avgRender.toFixed(2)} ms`,
      `segments ${segments.length}  strokes ${strokes.length}  decor ${decor.length}`,
      `sparks ${sparksFx.length}  pickups ${pickups.length}  cuts ${cuts.length}`,
      `canvas ${canvas.width}×${canvas.height} @${dpr}x`,
    ];
    ctx.font = '12px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const x = 20, y = 80;
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#0b0526';
    ctx.fillRect(x - 6, y - 4, 330, lines.length * 16 + 8);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    lines.forEach((line, i) => ctx.fillText(line, x, y + i * 16));
  }

  function trackPerf(now, frameMs, updateMs, renderMs) {
    perf.frames++;
    perf.updateMs += updateMs;
    perf.renderMs += renderMs;
    perf.worstFrame = Math.max(perf.worstFrame, frameMs);
    const elapsed = now - perf.windowStart;
    if (elapsed >= 500) {
      perf.fps = (perf.frames * 1000) / elapsed;
      perf.avgUpdate = perf.updateMs / perf.frames;
      perf.avgRender = perf.renderMs / perf.frames;
      perf.worst = perf.worstFrame;
      Object.assign(perf, { frames: 0, updateMs: 0, renderMs: 0, worstFrame: 0, windowStart: now });
    }
  }

  // ---------- flow ----------
  // The sign of the overlay: the two-colour title on the title screen, one word of the same sign for the other screens.
  const letreroEl = document.getElementById('letrero');
  const creditoEl = document.getElementById('credito');
  function setHeadline(text, isTitle) {
    letreroEl.classList.toggle('fin', !isTitle);
    if (!isTitle) { headline.textContent = text; return; }
    const voy = document.createElement('span');
    voy.className = 'voy';
    voy.textContent = L.titulo[0];
    headline.replaceChildren(voy, document.createTextNode(L.titulo[1]));
  }

  function showTitle() {
    setHeadline('', true);
    taglineEl.hidden = false;
    taglineEl.textContent = L.subtitulo;
    line1.hidden = false;
    line2.hidden = false;
    creditoEl.hidden = false;
    startBtn.textContent = L.empezar;
  }

  function showOverlay(reason, meters, isRecord, rankIndex) {
    renderRanking(rankIndex);
    setHeadline(reason === 'caught' ? L.pillado : L.caida, false);
    taglineEl.hidden = false;
    taglineEl.textContent = reason === 'caught' ? L.pilladoSub : L.caidaSub;
    line1.hidden = true;
    line2.hidden = true;
    creditoEl.hidden = true;
    scoreEl.hidden = false;
    scoreEl.textContent = fmtMeters(meters);
    bestEl.hidden = false;
    bestEl.classList.toggle('nuevo', isRecord);
    bestEl.textContent = isRecord ? L.nuevoRecord : fmtBest(L.record, best);
    startBtn.textContent = L.otraVez;
    controlsEl.hidden = true;
    overlay.hidden = false;
    startBtn.focus();
  }

  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    pen = null;
    sound.zumbido(0);
    sound.pausar();
    setHeadline(L.pausa, false);
    taglineEl.hidden = true;
    line1.hidden = true;
    line2.hidden = true;
    creditoEl.hidden = true;
    scoreEl.hidden = true;
    bestEl.hidden = true;
    hintEl.hidden = true;
    rankingBox.hidden = true;
    startBtn.textContent = L.seguir;
    controlsEl.hidden = true;
    overlay.hidden = false;
    startBtn.focus();
  }

  // Playing starts (or restarts) the music on the very click that plays, which is what the autoplay policy of the browsers wants.
  function play(isResume) {
    sound.init();
    if (!isResume) {
      reset();
      sound.musica();
      pedirRotulo('inicio', { fuerza: true, retraso: 0.5 });
    }
    state = 'play';
    taglineEl.hidden = true;
    hintEl.hidden = true;
    overlay.hidden = true;
    controlsEl.hidden = false;
  }
  const restart = () => play(false);
  const togglePause = () => { if (state === 'play') pause(); else if (state === 'paused') play(true); };

  startBtn.addEventListener('click', () => play(state === 'paused'));
  // blur so a later Space/Enter doesn't re-trigger the button behind the player's back
  pauseBtn.addEventListener('click', () => { pauseBtn.blur(); togglePause(); });
  restartBtn.addEventListener('click', () => { restartBtn.blur(); restart(); });

  function syncMute() {
    muteBtn.setAttribute('aria-pressed', String(sound.isMuted()));
    muteBtn.setAttribute('aria-label', sound.isMuted() ? L.activarSonido : L.silenciar);
  }
  muteBtn.addEventListener('click', () => { sound.init(); sound.toggleMute(); syncMute(); });
  syncMute();
  renderRanking(-1);
  showTitle();

  const canFullscreen = Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  fullscreenBtn.hidden = !canFullscreen;
  const isFullscreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  async function toggleFullscreen() {
    if (!canFullscreen) return;
    const root = document.documentElement;
    try {
      if (isFullscreen()) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        await (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: 'hide' });
        // Android can lock to landscape once fullscreen; everywhere else this quietly fails.
        await screen.orientation?.lock?.('landscape');
      }
    } catch { /* refused by the browser or the frame */ }
  }
  const syncFullscreen = () => fullscreenBtn.setAttribute('aria-pressed', String(isFullscreen()));
  document.addEventListener('fullscreenchange', syncFullscreen);
  document.addEventListener('webkitfullscreenchange', syncFullscreen);
  fullscreenBtn.addEventListener('click', () => { fullscreenBtn.blur(); toggleFullscreen(); });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    const isPauseKey = key === 'escape' || key === 'p';
    const isRestartKey = key === 'r';
    const canRestart = state !== 'title';
    if (isPauseKey) togglePause();
    else if (isRestartKey && canRestart) restart();
    else if (key === 'm') muteBtn.click();
    else if (key === 'f') toggleFullscreen();
    else if (key === 'd') perf.visible = !perf.visible;
  });

  // At most 60 frames per second: on 120 Hz screens every other animation frame is skipped.
  const MIN_FRAME_MS = 1000 / 60 - 1.5;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const frameMs = now - last;
    if (frameMs < MIN_FRAME_MS) return;
    const dt = Math.min(0.033, frameMs / 1000);
    last = now;
    animT = now / 1000;
    const t0 = performance.now();
    if (state === 'play') update(dt);
    else if (state === 'dead') updateDead(dt);
    const t1 = performance.now();
    render(animT);
    trackPerf(now, frameMs, t1 - t0, performance.now() - t1);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
