<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ea5a1c">
<title>Camiones y Caravanas</title>
<link rel="icon" type="image/png" href="./icono-192.png">
<link rel="apple-touch-icon" href="./icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Shrikhand&display=swap">
</head>
<body>
<div class="fondo" aria-hidden="true"><div class="rayos"></div><div class="anillos"></div></div>

<div class="portada entrada" id="portada">
  <main class="peg arco puerta">
    <div class="cielo"><img class="logo" src="./src/portada/logo.webp" data-alt="logo" alt="" width="563" height="637"></div>
    <form class="interior" id="formulario" autocomplete="off" novalidate>
      <h1 class="solo-lector" data-t="titulo"></h1>
      <p data-t="intro"></p>
      <label class="solo-lector" for="clave" data-t="etiqueta"></label>
      <input id="clave" name="clave" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="80" required>
      <p class="fallo" id="fallo" role="alert" hidden></p>
      <span class="dale"><button type="submit" id="boton" data-t="boton"></button></span>
    </form>
  </main>
</div>
<script type="module" src="/src/entrar/main.ts"></script>
</body>
</html>
