<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ea5a1c">
<title>Camiones y Caravanas</title>
<link rel="icon" type="image/png" href="./icono-192.png">
<link rel="apple-touch-icon" href="./icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Righteous&family=Shrikhand&display=swap">
</head>
<body>
<div class="fondo" aria-hidden="true"><div class="rayos"></div></div>

<div class="portada" id="portada">
<div class="cartel">
  <header class="cabecera">
    <button class="chapa" id="chapa" type="button" aria-haspopup="dialog"><span id="chapa-texto"></span></button>
    <h1 class="titulo" data-aria="titulo">
      <span class="palabra p1" aria-hidden="true" data-letras="titulo.1" data-desde="0"></span>
      <span class="fila" aria-hidden="true"><span class="ye" data-t="titulo.y"></span></span>
      <span class="palabra p2" aria-hidden="true" data-letras="titulo.2" data-desde="3"></span>
    </h1>
  </header>

  <main class="pegatinas">

    <!-- 1 · Camiones y Caravanas -->
    <article class="peg arco" id="capitulo1">
      <div class="cielo"><img class="logo" src="./src/portada/logo.webp" data-alt="capitulo1.logo" alt="" width="563" height="637"></div>
      <div class="interior">
        <h2 class="solo-lector" data-t="capitulo1.nombre"></h2>
        <p data-t="capitulo1.desc"></p>
        <ol class="caps">
          <li class="cap on">
            <div class="nom"><span class="n">1</span><span class="t" data-t="capitulo1.1"></span></div>
            <span class="dale"><a class="juego" href="/capitulo1" data-t="capitulo1.jugar"></a></span>
          </li>
          <li class="cap off" aria-disabled="true">
            <div class="nom"><span class="n">2</span><span class="t" data-t="capitulo1.2"></span></div>
            <span class="sellito" data-t="capitulo1.pronto"></span>
          </li>
        </ol>
      </div>
    </article>

    <!-- 2 · PokéUsera -->
    <div class="peg huevo-w">
      <article class="huevo" id="pokeusera">
        <div class="medalla"><img src="./src/portada/pokeusera.webp" data-alt="pokeusera.icono" alt="" width="512" height="512"></div>
        <h2 data-t="pokeusera.nombre"></h2>
        <p data-t="pokeusera.desc"></p>
        <div class="acciones">
          <ul class="etq">
            <li><i class="movil"></i><span data-t="pokeusera.vertical"></span></li>
            <li data-t="pokeusera.online"></li>
          </ul>
          <span class="dale ros"><a class="juego" href="/pokeusera" data-t="pokeusera.jugar"></a></span>
        </div>
      </article>
    </div>

    <!-- 3 · Pang -->
    <div class="peg burbuja" id="pang">
      <article class="cuerpo">
        <div class="interno">
          <h2 data-t="pang.nombre"></h2>
          <p data-t="pang.desc"></p>
          <span class="dale oli"><a class="juego" href="/pang" data-t="pang.jugar"></a></span>
        </div>
        <div class="doce"><i></i><span><b data-t="pang.fases.numero"></b><span data-t="pang.fases"></span></span></div>
        <!-- The first of everybody (src/portada/main.ts fills it in once the server answers; without data it stays hidden) -->
        <p class="record-pegatina" id="pang-record" hidden></p>
      </article>
    </div>

    <!-- 4 · Próximamente -->
    <div class="peg mas">
      <div class="rafaga-w">
        <span class="f f1"></span><span class="f f2"></span><span class="f f3"></span><span class="f f4"></span>
        <div class="txt"><h2 data-t="mas.nombre"></h2><p data-t="mas.desc"></p></div>
      </div>
    </div>

    <!-- 5 · Otros juegos (no son del universo Camiones y Caravanas): Fly y Trazo, fichas pequeñas sin imagen propia (dibujo en CSS). Cerrado por defecto -->
    <details class="otros-juegos">
      <summary data-t="otros.nombre"></summary>
      <div class="chicas">
        <article class="peg chica fly" id="fly">
          <div class="dibujo" aria-hidden="true"><i class="sol"></i><i class="pajaro"></i><i class="isla i1"></i><i class="isla i2"></i><i class="isla i3"></i></div>
          <div class="texto">
            <h2 data-t="fly.nombre"></h2>
            <p data-t="fly.desc"></p>
            <span class="dale"><a class="juego" href="/fly" data-t="fly.jugar"></a></span>
          </div>
        </article>
        <article class="peg chica trazo" id="trazo">
          <div class="dibujo" aria-hidden="true"><i class="borron"></i><i class="linea"></i><i class="gota"></i></div>
          <div class="texto">
            <h2 data-t="trazo.nombre"></h2>
            <p data-t="trazo.desc"></p>
            <span class="dale ros"><a class="juego" href="/trazo" data-t="trazo.jugar"></a></span>
          </div>
        </article>
      </div>
    </details>

  </main>
</div>

<footer class="pie">
  <p class="en" data-t="pie.en"></p>
  <p class="perra" data-t="pie.perra"></p>
  <p class="url" data-t="pie.url"></p>
</footer>
</div>
<!-- Account (src/portada/cuenta.ts): the badge at the top opens this panel -->
<dialog class="panel-cuenta" id="panel" aria-labelledby="panel-titulo">
  <h2 id="panel-titulo" tabindex="-1"></h2>

  <section data-vista="quien" hidden>
    <p data-t="cuenta.quien.desc"></p>
    <form data-form="crear" novalidate>
      <label class="solo-lector" for="cuenta-nombre" data-t="cuenta.nombre.etiqueta"></label>
      <input id="cuenta-nombre" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" required>
      <p class="nota" data-t="cuenta.nombre.ayuda"></p>
      <p class="aviso" role="alert" hidden></p>
      <span class="dale"><button type="submit" data-t="cuenta.crear"></button></span>
    </form>
    <div class="otros">
      <button type="button" class="enlace" data-ir="codigo" data-t="cuenta.yatengo"></button>
      <button type="button" class="enlace flojo" data-ahora-no data-t="cuenta.ahorano"></button>
    </div>
  </section>

  <section data-vista="codigo" hidden>
    <p data-t="cuenta.codigo.desc"></p>
    <form data-form="codigo" novalidate>
      <label class="solo-lector" for="cuenta-codigo" data-t="cuenta.codigo.etiqueta"></label>
      <input id="cuenta-codigo" class="codigo" type="text" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <p class="aviso" role="alert" hidden></p>
      <span class="dale"><button type="submit" data-t="cuenta.entrar"></button></span>
    </form>
    <div class="otros"><button type="button" class="enlace" data-ir="quien" data-t="cuenta.volver"></button></div>
  </section>

  <section data-vista="cuenta" hidden>
    <p class="nota creada" id="cuenta-creada" data-t="cuenta.mi.creada" hidden></p>
    <p class="etiqueta" data-t="cuenta.mi.codigo.nombre"></p>
    <p class="clave-codigo" id="cuenta-codigo-ver"></p>
    <p class="nota" data-t="cuenta.mi.codigo.desc"></p>
    <div class="otros">
      <button type="button" class="enlace" data-ir="cambiar" data-t="cuenta.mi.cambiar"></button>
      <button type="button" class="enlace flojo" data-cerrar data-t="cuenta.cerrar"></button>
    </div>
  </section>

  <section data-vista="cambiar" hidden>
    <form data-form="cambiar" novalidate>
      <label class="solo-lector" for="cuenta-otro" data-t="cuenta.cambiar.etiqueta"></label>
      <input id="cuenta-otro" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" required>
      <p class="nota" data-t="cuenta.nombre.ayuda"></p>
      <p class="aviso" role="alert" hidden></p>
      <span class="dale"><button type="submit" data-t="cuenta.guardar"></button></span>
    </form>
    <div class="otros"><button type="button" class="enlace" data-ir="cuenta" data-t="cuenta.volver"></button></div>
  </section>
</dialog>
<script type="module" src="/src/portada/main.ts"></script>
</body>
</html>
